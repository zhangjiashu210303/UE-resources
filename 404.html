<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>资源详情 · 正在跳转</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;height:100%;background:#050508;color:#9aa0b4;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;font-size:14px;}
  .spin{width:32px;height:32px;border:3px solid rgba(140,120,255,.25);
    border-top-color:#8c78ff;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 16px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .txt{text-align:center;line-height:1.8;}
</style>
<script>
(function () {
  try {
    var path = location.pathname;
    var m = path.match(/^(.*\/)index\.html\/(\d+)\/?$/);
    if (m) {
      location.replace(m[1] + 'index.html#' + m[2]);
      return;
    }
    // 其他 404 一律回主页
    var dir = path.replace(/\/[^\/]*$/, '/');
    location.replace(dir + 'index.html');
  } catch (e) {
    location.replace('/index.html');
  }
})();
</script>
</head>
<body>
<div>
  <div class="spin"></div>
  <div class="txt">正在加载资源详情…</div>
</div>
</body>
</html>
