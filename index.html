<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UE 资源中心 · 极光下载站</title>
  <!-- 引入字体与基础样式 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* 全局重置 + 极光暗色主题 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0c0f;
      color: #eef2f6;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #101418;
    }
    ::-webkit-scrollbar-thumb {
      background: #2e3a47;
      border-radius: 20px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f5062;
    }

    /* ---------- 极光与网格背景层 ---------- */
    .aurora-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: radial-gradient(circle at 20% 30%, rgba(64, 180, 255, 0.15), transparent 45%),
                  radial-gradient(circle at 80% 70%, rgba(170, 80, 255, 0.18), transparent 50%),
                  radial-gradient(circle at 40% 80%, rgba(0, 255, 200, 0.1), transparent 60%),
                  #0a0c0f;
      filter: blur(40px);
      opacity: 0.9;
    }

    .grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ---------- 主界面（全屏极光） ---------- */
    .hero {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      z-index: 10;
      transition: transform 0.75s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.5s ease;
      background: rgba(10, 12, 15, 0.2);
      backdrop-filter: blur(8px);
      will-change: transform;
    }

    .hero.hidden {
      transform: translateY(-120vh);
      opacity: 0;
      pointer-events: none;
    }

    .hero h1 {
      font-size: clamp(2.8rem, 10vw, 6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #b0e0ff 40%, #d0a0ff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      text-shadow: 0 0 40px rgba(64, 180, 255, 0.4);
    }

    .hero p {
      font-size: 1.25rem;
      color: #94a3b8;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .hero .hint {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #5f7d9c;
      font-size: 0.9rem;
      animation: pulse 2s infinite;
    }

    .hero .hint span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #40b4ff;
      box-shadow: 0 0 12px #40b4ff;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ---------- 资源列表区域 ---------- */
    .list-section {
      position: relative;
      min-height: 100vh;
      padding: 4rem 1.5rem 6rem;
      margin-top: 100vh; /* 初始被主界面覆盖，滚动后出现 */
      z-index: 20;
      transition: margin-top 0.75s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .list-section.visible {
      margin-top: 0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 工具栏：搜索 + 添加 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 3rem;
      padding: 0.5rem 0;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.9rem 1.2rem 0.9rem 3rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(18, 24, 32, 0.8);
      backdrop-filter: blur(10px);
      color: #eef2f6;
      font-size: 1rem;
      transition: all 0.3s;
      outline: none;
    }

    .search-box input:focus {
      border-color: #40b4ff;
      box-shadow: 0 0 0 4px rgba(64, 180, 255, 0.15);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      opacity: 0.6;
    }

    .btn {
      padding: 0.9rem 1.8rem;
      border-radius: 60px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #40b4ff, #7b5aff);
      color: white;
      box-shadow: 0 8px 24px rgba(64, 180, 255, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(64, 180, 255, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #eef2f6;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #40b4ff;
    }

    .btn-sm {
      padding: 0.6rem 1.2rem;
      font-size: 0.85rem;
    }

    .btn-danger {
      background: rgba(255, 80, 80, 0.15);
      color: #ff8a8a;
      border: 1px solid rgba(255, 80, 80, 0.2);
    }

    .btn-danger:hover {
      background: rgba(255, 80, 80, 0.25);
    }

    /* 卡片网格 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.8rem;
      perspective: 1000px;
    }

    /* 卡片样式 —— 液态玻璃 */
    .card {
      background: rgba(20, 26, 34, 0.7);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 28px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(40px) scale(0.96);
      animation: cardReveal 0.65s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    .card:hover {
      border-color: rgba(64, 180, 255, 0.3);
      box-shadow: 0 30px 60px -15px rgba(64, 180, 255, 0.2);
      transform: translateY(-6px) scale(1.01);
    }

    @keyframes cardReveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-preview {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #11171f;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s;
    }

    .card:hover .card-preview img {
      transform: scale(1.04);
    }

    .card-preview .media-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 0.25rem 0.75rem;
      border-radius: 40px;
      font-size: 0.75rem;
      color: #a0c0e0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-content {
      padding: 1.5rem 1.5rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      line-height: 1.3;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #92a8c0;
      line-height: 1.6;
      margin-bottom: 1.2rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      margin-top: auto;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .link-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.45rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s;
      text-decoration: none;
      border: 1px solid transparent;
    }

    .link-badge.baidu {
      background: rgba(40, 100, 200, 0.15);
      color: #7db8ff;
      border-color: rgba(40, 100, 200, 0.2);
    }

    .link-badge.quark {
      background: rgba(100, 200, 150, 0.12);
      color: #7dffb0;
      border-color: rgba(100, 200, 150, 0.2);
    }

    .link-badge.default-link {
      background: rgba(255, 255, 255, 0.05);
      color: #c0d0e0;
      border-color: rgba(255, 255, 255, 0.08);
    }

    .link-badge:hover {
      transform: translateY(-1px);
      filter: brightness(1.2);
    }

    .code-tag {
      font-size: 0.7rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      color: #b0c0d0;
      margin-left: 0.2rem;
    }

    .card-meta-actions {
      display: flex;
      gap: 0.4rem;
      margin-left: auto;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #6d7f93;
      padding: 0.3rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #eef2f6;
    }

    /* 表单模态框 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #141a22;
      border-radius: 32px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
    }

    .modal h2 {
      font-size: 1.6rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, #b0d0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #92a8c0;
      margin-bottom: 0.4rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(10, 14, 20, 0.6);
      color: #eef2f6;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.2s;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #40b4ff;
      box-shadow: 0 0 0 3px rgba(64, 180, 255, 0.1);
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .link-row {
      display: grid;
      grid-template-columns: 1fr 2fr 0.8fr auto;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .link-row input {
      padding: 0.6rem 0.8rem;
      font-size: 0.85rem;
    }

    .btn-remove-link {
      background: rgba(255, 80, 80, 0.15);
      border: none;
      color: #ff8a8a;
      border-radius: 12px;
      padding: 0.6rem;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }

    .btn-remove-link:hover {
      background: rgba(255, 80, 80, 0.3);
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      justify-content: flex-end;
    }

    /* 灯箱 */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 24px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
    }

    .lightbox-close {
      position: absolute;
      top: 2rem;
      right: 2rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      font-size: 2rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* 加载状态 */
    .loading-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #6d7f93;
    }

    .spinner {
      display: inline-block;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(64, 180, 255, 0.15);
      border-top-color: #40b4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 提示条 */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(20, 30, 40, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #eef2f6;
      padding: 1rem 2rem;
      border-radius: 60px;
      font-size: 0.9rem;
      z-index: 300;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 响应式 */
    @media (max-width: 700px) {
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .link-row {
        grid-template-columns: 1fr 1fr;
      }
      .card-grid {
        grid-template-columns: 1fr;
      }
      .hero h1 {
        font-size: 2.5rem;
      }
    }

    /* 隐藏的 token 区域 */
    .token-panel {
      display: none;
    }
  </style>
</head>
<body>
  <!-- 极光与网格背景 -->
  <div class="aurora-bg"></div>
  <div class="grid-overlay"></div>

  <!-- 主界面（全屏极光） -->
  <section class="hero" id="hero">
    <h1>UE 资源极光站</h1>
    <p>程序化武器 · 场景资产 · 工具插件 · 一触即达</p>
    <div class="hint">
      <span></span>
      向下滚动，浏览全部资源
    </div>
  </section>

  <!-- 资源列表区域 -->
  <main class="list-section" id="listSection">
    <div class="container">
      <!-- 工具栏 -->
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索资源名称、描述或目录…" autocomplete="off">
        </div>
        <div style="display: flex; gap: 0.8rem;">
          <button class="btn btn-outline" id="refreshBtn" title="重新加载 JSON">⟳ 刷新</button>
          <button class="btn btn-primary" id="addBtn">+ 新增资源</button>
        </div>
      </div>

      <!-- 卡片网格 / 加载状态 -->
      <div id="cardGrid" class="card-grid">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>正在加载资源…</p>
        </div>
      </div>
    </div>
  </main>

  <!-- 新增/编辑模态框 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">新增资源</h2>
      <form id="resourceForm">
        <input type="hidden" id="editId" value="">
        <div class="form-group">
          <label>名称 *</label>
          <input type="text" id="formName" required placeholder="例如：程序化武器生成系统">
        </div>
        <div class="form-group">
          <label>描述</label>
          <textarea id="formDesc" placeholder="详细描述…"></textarea>
        </div>
        <div class="form-group">
          <label>下载目录（可选）</label>
          <input type="text" id="formDownloadDir" placeholder="例如：assets/weapons">
        </div>
        <div class="form-group">
          <label>预览媒体 URL（图片或视频）</label>
          <input type="text" id="formPreview" placeholder="https://…">
        </div>
        <div class="form-group">
          <label>下载链接</label>
          <div id="linksContainer">
            <!-- 动态链接行 -->
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="addLinkBtn" style="margin-top: 0.5rem;">+ 添加链接</button>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="cancelModalBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">×</button>
    <img src="" alt="预览大图" id="lightboxImg">
  </div>

  <!-- 提示条 -->
  <div class="toast" id="toast"></div>

  <!-- 隐藏的 token 读取（URL 参数） -->
  <script>
    (function() {
      // 从 URL 读取 token 并存储
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      if (token) {
        localStorage.setItem('gh_token', token);
        // 清除 URL 中的 token 参数（可选，保持地址干净）
        if (window.history.replaceState) {
          const newUrl = window.location.pathname + window.location.hash;
          window.history.replaceState({}, '', newUrl);
        }
      }
    })();
  </script>

  <!-- 主逻辑 -->
  <script>
    // ---------- 配置 ----------
    const RAW_URL = 'https://raw.githubusercontent.com/zhangjiashu210303/UE-resources/main/assets.json';
    const REPO_OWNER = 'zhangjiashu210303';
    const REPO_NAME = 'UE-resources';
    const BRANCH = 'main';
    const FILE_PATH = 'assets.json';

    // ---------- 全局状态 ----------
    let assets = [];           // 从 JSON 读取的资源数组
    let filteredAssets = [];
    let searchQuery = '';
    let isPreviewMode = false;

    // 模态框元素
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const resourceForm = document.getElementById('resourceForm');
    const editIdInput = document.getElementById('editId');
    const formName = document.getElementById('formName');
    const formDesc = document.getElementById('formDesc');
    const formDownloadDir = document.getElementById('formDownloadDir');
    const formPreview = document.getElementById('formPreview');
    const linksContainer = document.getElementById('linksContainer');
    const addLinkBtn = document.getElementById('addLinkBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const addBtn = document.getElementById('addBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const searchInput = document.getElementById('searchInput');
    const cardGrid = document.getElementById('cardGrid');
    const toast = document.getElementById('toast');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    // ---------- 辅助函数 ----------
    function showToast(msg, duration = 2600) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    function getToken() {
      return localStorage.getItem('gh_token') || '';
    }

    // 创建链接行 HTML
    function createLinkRow(name = '', url = '', code = '') {
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `
        <input type="text" class="link-name" placeholder="网盘名称" value="${escapeHtml(name)}">
        <input type="text" class="link-url" placeholder="链接地址" value="${escapeHtml(url)}">
        <input type="text" class="link-code" placeholder="提取码" value="${escapeHtml(code)}">
        <button type="button" class="btn-remove-link" title="删除链接">✕</button>
      `;
      row.querySelector('.btn-remove-link').addEventListener('click', () => {
        row.remove();
      });
      return row;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });
    }

    // 打开模态框（新增/编辑）
    function openModal(resource = null) {
      linksContainer.innerHTML = '';
      if (resource) {
        modalTitle.textContent = '编辑资源';
        editIdInput.value = resource.id || '';
        formName.value = resource.name || '';
        formDesc.value = resource.desc || '';
        formDownloadDir.value = resource.downloadDir || '';
        formPreview.value = resource.preview || '';
        if (resource.links && resource.links.length) {
          resource.links.forEach(link => {
            linksContainer.appendChild(createLinkRow(link.name, link.url, link.code || ''));
          });
        } else {
          linksContainer.appendChild(createLinkRow());
        }
      } else {
        modalTitle.textContent = '新增资源';
        editIdInput.value = '';
        formName.value = '';
        formDesc.value = '';
        formDownloadDir.value = '';
        formPreview.value = '';
        linksContainer.appendChild(createLinkRow());
      }
      modalOverlay.classList.add('active');
      formName.focus();
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    // 从表单收集数据
    function collectFormData() {
      const id = editIdInput.value || Date.now().toString();
      const name = formName.value.trim();
      if (!name) {
        showToast('请填写资源名称');
        return null;
      }
      const desc = formDesc.value.trim();
      const downloadDir = formDownloadDir.value.trim();
      const preview = formPreview.value.trim();

      const links = [];
      const rows = linksContainer.querySelectorAll('.link-row');
      rows.forEach(row => {
        const nameInput = row.querySelector('.link-name');
        const urlInput = row.querySelector('.link-url');
        const codeInput = row.querySelector('.link-code');
        const linkName = nameInput.value.trim();
        const linkUrl = urlInput.value.trim();
        const linkCode = codeInput.value.trim();
        if (linkName && linkUrl) {
          links.push({ name: linkName, url: linkUrl, ...(linkCode ? { code: linkCode } : {}) });
        }
      });

      return {
        id,
        name,
        desc,
        downloadDir: downloadDir || undefined,
        preview: preview || undefined,
        links
      };
    }

    // ---------- 读取 JSON（纯 RAW） ----------
    async function fetchAssets() {
      cardGrid.innerHTML = `<div class="loading-state"><div class="spinner"></div><p>正在从 GitHub 加载资源…</p></div>`;

      try {
        const response = await fetch(RAW_URL, { cache: 'no-cache' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error('JSON 根节点不是数组');
        assets = data;
        isPreviewMode = false;
        showToast(`✅ 已加载 ${assets.length} 个资源`);
      } catch (err) {
        console.error('加载失败:', err);
        isPreviewMode = true;
        // 预览模式：内置 12 个示例
        assets = generatePreviewAssets();
        showToast('⚠️ 网络加载失败，显示预览示例');
      }

      applySearch();
    }

    // 生成 12 个预览资源（canvas 生成缩略图）
    function generatePreviewAssets() {
      const names = [
        '程序化武器生成系统 PWAS', '可定制图标包 · 通用', 'Ultra Dynasty Sky 9.7',
        '废弃地铁站场景包', '军事基地场景包', 'Blockout Tools 关卡原型',
        'BODYCAM FPS KIT V4', '专业图标包 Pro Icon Pack', '轴心点工具 Pivot Tool',
        '武器定制系统', '高级粒子特效包', '动态天空系统'
      ];
      const descs = [
        '基于蓝图的全程序化武器动画框架，支持后坐力、摇摆、瞄准等实时生成。',
        '包含100个独特图标和32个可自定义按钮，平色或渐变选项。',
        '高品质动态天空，包含云层、体积光和天气系统。',
        '废弃地铁站完整场景，包含道具、材质和蓝图。',
        '军事基地场景包，包含建筑、载具和掩体。',
        '轻量级关卡遮挡工具，快速灰盒设计，支持三平面材质。',
        '第一人称视角拍摄套件，模拟执法记录仪效果。',
        '灵活智能的图标工具，适用于物品栏、界面和主菜单。',
        '在虚幻编辑器中修改和烘烤网格枢轴点，27种预设。',
        '完整的武器定制系统，支持配件、皮肤和模块化。',
        '高级Niagara粒子特效合集，包含爆炸、烟雾、魔法等。',
        '动态天空系统，支持昼夜循环和体积云。'
      ];
      const links = [
        [{ name: '百度网盘', url: 'https://pan.baidu.com/s/1HshiVxHykOd2FINSqknYMw', code: 'Bdqn' }],
        [{ name: '百度网盘', url: 'https://pan.baidu.com/s/1UaT1rzUh8eIPBvhl_3Rqmg', code: 'bwoo' }],
        [{ name: '百度网盘', url: 'https://pan.baidu.com/s/1DzvRBOgeiq8KcoWTeqpBdA', code: 'x91e' }],
        [{ name: '夸克网盘', url: 'https://pan.quark.cn/s/d50b7e6976af' }],
        [{ name: '夸克网盘', url: 'https://pan.quark.cn/s/c920bf0db0e2' }],
        [{ name: '百度网盘', url: 'https://pan.baidu.com/wap/init?surl=dg4IHvX5WM7QWuprDIFtyg', code: 'znuk' }],
        [{ name: '百度网盘', url: 'https://pan.baidu.com/wap/init?surl=v83osfX5pQYUPZr7iELTJQ', code: 'd9hz' }],
        [{ name: '百度网盘', url: 'https://pan.baidu.com/wap/init?surl=2O1xmX4Nw1Ge09e2-sbp2w', code: 'zsnr' }],
        [{ name: '百度网盘', url: 'https://pan.baidu.com/share/init?surl=ULkV8SRj66mf7WlRpdnZVg', code: 'ncb6' }],
        [{ name: '百度网盘', url: 'https://pan.baidu.com/s/1SJGC8DFTQOBHP7H1xum74A', code: 'sqxU' }],
        [{ name: '百度网盘', url: 'https://pan.baidu.com/s/1example', code: 'exmp' }],
        [{ name: '夸克网盘', url: 'https://pan.quark.cn/s/example' }]
      ];

      const arr = [];
      for (let i = 0; i < 12; i++) {
        // 用 canvas 生成渐变色缩略图
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 400;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 640, 400);
        const hue = (i * 31) % 360;
        grad.addColorStop(0, `hsl(${hue}, 70%, 25%)`);
        grad.addColorStop(0.5, `hsl(${(hue + 40) % 360}, 80%, 35%)`);
        grad.addColorStop(1, `hsl(${(hue + 80) % 360}, 75%, 20%)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 640, 400);
        // 添加网格线
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        for (let x = 0; x < 640; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 400); ctx.stroke();
        }
        for (let y = 0; y < 400; y += 40) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(640, y); ctx.stroke();
        }
        // 添加文字
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.font = 'bold 32px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`UE 资源 ${i + 1}`, 320, 190);
        ctx.font = '18px Inter, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText('预览示例', 320, 240);
        const dataUrl = canvas.toDataURL('image/png');

        arr.push({
          id: `preview-${i + 1}`,
          name: names[i] || `资源 ${i + 1}`,
          desc: descs[i] || '这是一个预览示例资源，描述信息暂时空缺。',
          preview: dataUrl,
          links: links[i] || [{ name: '示例网盘', url: '#', code: 'demo' }]
        });
      }
      return arr;
    }

    // ---------- 渲染卡片 ----------
    function renderCards() {
      if (!filteredAssets.length) {
        cardGrid.innerHTML = `<div class="loading-state" style="grid-column:1/-1;"><p>没有匹配的资源</p></div>`;
        return;
      }

      cardGrid.innerHTML = filteredAssets.map((asset, index) => {
        const previewUrl = asset.preview || '';
        const isVideo = previewUrl.match(/\.(mp4|webm|mov|avi)$/i);
        const displayUrl = isVideo ? previewUrl.replace(/\.(mp4|webm|mov|avi)$/i, '.jpg') : previewUrl;

        // 链接按钮
        const linkButtons = (asset.links || []).map(link => {
          let badgeClass = 'default-link';
          if (link.name.includes('百度')) badgeClass = 'baidu';
          else if (link.name.includes('夸克')) badgeClass = 'quark';
          const codeHtml = link.code ? `<span class="code-tag">${escapeHtml(link.code)}</span>` : '';
          return `<a href="${escapeHtml(link.url)}" target="_blank" rel="noopener" class="link-badge ${badgeClass}">${escapeHtml(link.name)}${codeHtml}</a>`;
        }).join('');

        // 编辑/删除按钮
        const metaActions = `
          <button class="icon-btn edit-btn" data-id="${asset.id}" title="编辑">✎</button>
          <button class="icon-btn delete-btn" data-id="${asset.id}" title="删除">🗑</button>
        `;

        // 延迟动画
        const delay = (index % 12) * 0.06;

        return `
          <div class="card" style="animation-delay: ${delay}s" data-id="${asset.id}">
            <div class="card-preview" onclick="openLightbox('${escapeHtml(displayUrl)}')">
              ${displayUrl ? `<img src="${escapeHtml(displayUrl)}" alt="${escapeHtml(asset.name)}" loading="lazy">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#11171f;color:#4a5a6a;">无预览</div>`}
              ${isVideo ? '<span class="media-badge">🎬 视频</span>' : ''}
            </div>
            <div class="card-content">
              <h3 class="card-title">${escapeHtml(asset.name)}</h3>
              <p class="card-desc">${escapeHtml(asset.desc || '暂无描述')}</p>
              <div class="card-actions">
                ${linkButtons || '<span style="color:#4a5a6a;font-size:0.8rem;">暂无链接</span>'}
                <div class="card-meta-actions">
                  ${metaActions}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 绑定编辑/删除事件（使用事件委托或直接绑定）
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const asset = assets.find(a => a.id === id);
          if (asset) openModal(asset);
        });
      });
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          if (confirm('确定要删除这个资源吗？')) {
            const index = assets.findIndex(a => a.id === id);
            if (index !== -1) {
              assets.splice(index, 1);
              applySearch();
              showToast('已删除（本地），点击「发布」同步到 GitHub');
            }
          }
        });
      });
    }

    // 灯箱
    window.openLightbox = function(url) {
      if (!url) return;
      lightboxImg.src = url;
      lightbox.classList.add('active');
    };

    lightboxClose.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) lightbox.classList.remove('active');
    });

    // 搜索过滤
    function applySearch() {
      const q = searchQuery.toLowerCase().trim();
      filteredAssets = assets.filter(asset => {
        if (!q) return true;
        return (asset.name || '').toLowerCase().includes(q) ||
               (asset.desc || '').toLowerCase().includes(q) ||
               (asset.downloadDir || '').toLowerCase().includes(q);
      });
      renderCards();
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      applySearch();
    });

    // ---------- 表单操作 ----------
    addBtn.addEventListener('click', () => openModal(null));
    cancelModalBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    addLinkBtn.addEventListener('click', () => {
      linksContainer.appendChild(createLinkRow());
    });

    resourceForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = collectFormData();
      if (!data) return;

      const existingIndex = assets.findIndex(a => a.id === data.id);
      if (existingIndex !== -1) {
        assets[existingIndex] = data;
        showToast('✅ 已更新资源');
      } else {
        assets.push(data);
        showToast('✅ 已添加资源');
      }
      closeModal();
      applySearch();
      // 可选：自动发布？这里不自动发布，让用户手动点击发布按钮（在工具栏未显示发布按钮，但可通过 refresh 重新拉取）
      // 为方便，我们提供一个隐藏的发布功能：双击刷新按钮触发发布？不，改为在编辑/删除时提示同步。
      // 但用户需求是“直接发布到 GitHub”，所以我在工具栏加一个发布按钮？但空间有限。
      // 为了符合需求，我们添加一个“发布”按钮放在工具栏右侧。
      // 修改：在 toolbar 中添加发布按钮。
    });

    // 由于上面需要发布按钮，我们动态添加一个（也可以修改 HTML）
    // 直接在 toolbar 中追加一个按钮
    (function addPublishButton() {
      const toolbar = document.querySelector('.toolbar');
      const btnContainer = toolbar.querySelector('div:last-child');
      if (btnContainer) {
        const publishBtn = document.createElement('button');
        publishBtn.className = 'btn btn-outline';
        publishBtn.id = 'publishBtn';
        publishBtn.textContent = '📤 发布到 GitHub';
        publishBtn.title = '将当前资源列表推送到远程 assets.json（需要 Token）';
        btnContainer.appendChild(publishBtn);

        publishBtn.addEventListener('click', async () => {
          const token = getToken();
          if (!token) {
            const newToken = prompt('请输入 GitHub Personal Access Token（细粒度，仅需此仓库 Contents 读写权限）');
            if (!newToken) return;
            localStorage.setItem('gh_token', newToken);
            showToast('Token 已保存到本地');
            return;
          }

          if (!confirm('确定要将当前资源列表发布到 GitHub 吗？')) return;

          try {
            // 先获取当前文件 SHA
            const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
            const getRes = await fetch(apiUrl, {
              headers: { Authorization: `Bearer ${token}` }
            });
            if (!getRes.ok) throw new Error(`获取文件信息失败: ${getRes.status}`);
            const fileInfo = await getRes.json();
            const sha = fileInfo.sha;

            // 编码内容
            const content = JSON.stringify(assets, null, 2);
            const base64Content = btoa(unescape(encodeURIComponent(content)));

            // 提交更新
            const putRes = await fetch(apiUrl, {
              method: 'PUT',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: '📦 更新资源列表 via UE 资源中心',
                content: base64Content,
                sha: sha,
                branch: BRANCH
              })
            });
            if (!putRes.ok) throw new Error(`提交失败: ${putRes.status}`);
            showToast('✅ 已成功发布到 GitHub！');
          } catch (err) {
            console.error(err);
            showToast(`❌ 发布失败: ${err.message}`);
          }
        });
      }
    })();

    // 刷新按钮
    refreshBtn.addEventListener('click', () => {
      fetchAssets();
    });

    // ---------- 滚动逻辑 ----------
    const hero = document.getElementById('hero');
    const listSection = document.getElementById('listSection');
    let isListVisible = false;

    function checkScroll() {
      const scrollY = window.scrollY;
      const heroHeight = hero.offsetHeight;
      // 当滚动超过 hero 高度的 10% 时，切换
      if (scrollY > heroHeight * 0.1 && !isListVisible) {
        hero.classList.add('hidden');
        listSection.classList.add('visible');
        isListVisible = true;
      } else if (scrollY < heroHeight * 0.1 && isListVisible) {
        hero.classList.remove('hidden');
        listSection.classList.remove('visible');
        isListVisible = false;
        // 滚动回顶部
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // 使用节流
    let ticking = false;
    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          checkScroll();
          ticking = false;
        });
        ticking = true;
      }
    });

    // 初始化
    (async function init() {
      await fetchAssets();
      // 确保初始状态
      checkScroll();
    })();

    // 暴露一些全局方法供调试
    window.assets = assets;
  </script>
</body>
</html>
