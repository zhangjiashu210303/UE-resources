<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UE 资源站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,sans-serif;background:#0a0c0f;color:#eef2f6;overflow-x:hidden}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:#101418}
  ::-webkit-scrollbar-thumb{background:#2e3a47;border-radius:20px}
  ::-webkit-scrollbar-thumb:hover{background:#3f5062}

  /* ===== 深空背景 ===== */
  .aurora-bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 20% 30%,rgba(64,180,255,.18),transparent 45%),radial-gradient(circle at 80% 70%,rgba(170,80,255,.22),transparent 50%),radial-gradient(circle at 40% 80%,rgba(0,255,200,.12),transparent 60%),#0a0c0f;filter:blur(40px)}
  .grid-overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:40px 40px}

  #listView{display:none}
  #listView.active{display:block}
  #detailView{display:none}
  #detailView.active{display:block}

  /* ===== Liquid Glass 核心材质 ===== */
  .liquid-glass{
    position:relative;
    background:linear-gradient(135deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 50%,rgba(255,255,255,.08) 100%);
    -webkit-backdrop-filter:blur(24px) saturate(1.8) brightness(1.08);
    backdrop-filter:blur(24px) saturate(1.8) brightness(1.08);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:
      0 24px 60px -22px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.45),
      inset 0 -1px 0 rgba(255,255,255,.08),
      inset 1px 0 0 rgba(255,255,255,.10),
      inset -1px 0 0 rgba(255,255,255,.10);
  }
  .liquid-glass::after{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(600px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.14),transparent 40%);
    opacity:0;transition:opacity .4s;
  }
  .liquid-glass:hover::after{opacity:1}

  /* ===== Hero ===== */
  .hero{position:fixed;top:0;left:0;width:100%;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem;z-index:10;transition:transform .75s cubic-bezier(.23,1,.32,1),opacity .5s;background:rgba(10,12,15,.2);backdrop-filter:blur(8px);will-change:transform}
  .hero.hidden{transform:translateY(-120vh);opacity:0;pointer-events:none}
  .hero h1{
    font-size:clamp(2.8rem,10vw,6rem);font-weight:700;letter-spacing:-.03em;
    background:linear-gradient(120deg,#fff 0%,#b0e0ff 25%,#d0a0ff 50%,#b0e0ff 75%,#fff 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-bottom:1rem;text-shadow:0 0 40px rgba(64,180,255,.4);
    animation:shimmer 8s ease-in-out infinite;
  }
  @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .hero p{font-size:1.25rem;color:#94a3b8;max-width:600px;line-height:1.6;margin-bottom:2rem}
  .hero .hint{display:flex;align-items:center;gap:.5rem;color:#5f7d9c;font-size:.9rem;animation:pulse 2s infinite}
  .hero .hint span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#40b4ff;box-shadow:0 0 12px #40b4ff}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

  /* ===== 列表页独立滚动容器 ===== */
  body.list-mode{overflow:hidden}
  .list-section{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;padding:4rem 1.5rem 6rem;z-index:20;transform:translateY(105%);transition:transform .75s cubic-bezier(.23,1,.32,1);will-change:transform;-webkit-overflow-scrolling:touch}
  .list-section.visible{transform:translateY(0)}
  .container{max-width:1400px;margin:0 auto}

  /* ===== 工具栏 ===== */
  .toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:3rem;padding:.5rem 0}
  .search-box{flex:1;min-width:260px;position:relative}
  .search-box input{
    width:100%;padding:.9rem 1.2rem .9rem 3rem;border-radius:60px;
    background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    -webkit-backdrop-filter:blur(22px) saturate(1.8);
    backdrop-filter:blur(22px) saturate(1.8);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 30px rgba(0,0,0,.35);
    color:#eef2f6;font-size:1rem;transition:.3s;outline:none;
  }
  .search-box input:focus{border-color:rgba(64,180,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 4px rgba(64,180,255,.12),0 14px 36px rgba(64,180,255,.18)}
  .search-box::before{content:"🔍";position:absolute;left:1.2rem;top:50%;transform:translateY(-50%);font-size:1.2rem;opacity:.6;z-index:1}

  /* ===== 按钮：物理挤压回弹 ===== */
  .btn{
    padding:.9rem 1.8rem;border-radius:60px;border:none;font-weight:600;font-size:.95rem;cursor:pointer;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,background .25s,border-color .25s;
    display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;position:relative;overflow:hidden;
  }
  .btn:active{transform:scale(.96) translateY(1px);transition-duration:.08s}
  .btn-primary{
    background:linear-gradient(135deg,#40b4ff,#7b5aff);color:#fff;
    box-shadow:0 10px 28px rgba(64,180,255,.25),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.2);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(64,180,255,.4),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.2)}
  .btn-outline{
    background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    -webkit-backdrop-filter:blur(18px) saturate(1.6);
    backdrop-filter:blur(18px) saturate(1.6);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 10px 28px rgba(0,0,0,.3);
    color:#eef2f6;
  }
  .btn-outline:hover{background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.04));border-color:rgba(64,180,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 14px 36px rgba(64,180,255,.18)}
  .btn-sm{padding:.6rem 1.2rem;font-size:.85rem}
  .btn-danger{background:rgba(255,80,80,.15);color:#ff8a8a;border:1px solid rgba(255,80,80,.2)}
  .btn-danger:hover{background:rgba(255,80,80,.25)}

  /* ===== 卡片：空间纵深 + 动态高光 ===== */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.8rem;perspective:1200px}
  .card{
    position:relative;transform-style:preserve-3d;
    background:linear-gradient(135deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 50%,rgba(255,255,255,.07) 100%);
    -webkit-backdrop-filter:blur(26px) saturate(1.8) brightness(1.06);
    backdrop-filter:blur(26px) saturate(1.8) brightness(1.06);
    border:1px solid rgba(255,255,255,.15);
    border-radius:28px;overflow:hidden;
    transition:transform .5s cubic-bezier(.23,1,.32,1),box-shadow .5s,border-color .5s;
    display:flex;flex-direction:column;
    opacity:0;transform:translateY(40px) scale(.96) rotateX(0deg) rotateY(0deg);
    animation:cardReveal .65s cubic-bezier(.23,1,.32,1) forwards;
    box-shadow:
      0 24px 50px -20px rgba(0,0,0,.75),
      inset 0 1px 0 rgba(255,255,255,.42),
      inset 0 -1px 0 rgba(255,255,255,.08);
  }
  .card::before{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
    background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.03) 35%,transparent 70%);
  }
  .card::after{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
    background:radial-gradient(500px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.18),transparent 42%);
    opacity:0;transition:opacity .4s;
  }
  .card:hover::after{opacity:1}
  .card:hover{
    border-color:rgba(64,180,255,.35);
    box-shadow:
      0 40px 80px -24px rgba(64,180,255,.28),
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -1px 0 rgba(255,255,255,.10);
  }
  @keyframes cardReveal{to{opacity:1;transform:translateY(0) scale(1) rotateX(0deg) rotateY(0deg)}}

  .card-preview{width:100%;aspect-ratio:16/10;background:#11171f;overflow:hidden;position:relative;cursor:pointer;display:block;text-decoration:none;z-index:2;transform:translateZ(20px)}
  .card-preview img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
  .card:hover .card-preview img{transform:scale(1.04)}
  .card-preview .media-badge{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);padding:.25rem .75rem;border-radius:40px;font-size:.75rem;color:#a0c0e0;border:1px solid rgba(255,255,255,.16)}
  .card-preview .detail-hint{position:absolute;bottom:12px;left:12px;background:rgba(64,180,255,.85);backdrop-filter:blur(10px);padding:.3rem .8rem;border-radius:40px;font-size:.72rem;color:#fff;opacity:0;transition:.3s;font-weight:600}
  .card:hover .detail-hint{opacity:1}

  .card-content{padding:1.5rem 1.5rem 1.2rem;flex:1;display:flex;flex-direction:column;position:relative;z-index:2;transform:translateZ(30px)}
  .card-title{font-size:1.25rem;font-weight:700;margin-bottom:.5rem;line-height:1.3;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-desc{font-size:.85rem;color:#92a8c0;line-height:1.6;margin-bottom:1.2rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
  .card-actions{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin-top:auto;padding-top:.6rem;border-top:1px solid rgba(255,255,255,.06)}

  .link-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.45rem 1rem;border-radius:40px;font-size:.8rem;font-weight:500;transition:.2s;text-decoration:none;border:1px solid transparent}
  .link-badge.baidu{background:rgba(40,100,200,.18);color:#7db8ff;border-color:rgba(80,150,255,.3)}
  .link-badge.quark{background:rgba(100,200,150,.15);color:#7dffb0;border-color:rgba(100,220,160,.3)}
  .link-badge.default-link{background:rgba(255,255,255,.07);color:#c0d0e0;border-color:rgba(255,255,255,.12)}
  .link-badge:hover{transform:translateY(-1px);filter:brightness(1.2)}
  .code-tag{font-size:.7rem;background:rgba(0,0,0,.4);padding:.15rem .5rem;border-radius:20px;color:#b0c0d0;margin-left:.2rem}

  .icon-btn{background:transparent;border:none;color:#6d7f93;padding:.3rem .5rem;border-radius:8px;cursor:pointer;font-size:.9rem;transition:.2s}
  .icon-btn:hover{background:rgba(255,255,255,.08);color:#eef2f6}

  .loading-state{text-align:center;padding:4rem 2rem;color:#6d7f93;grid-column:1/-1}
  .spinner{display:inline-block;width:36px;height:36px;border:3px solid rgba(64,180,255,.15);border-top-color:#40b4ff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:1rem}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== 详情页顶栏 ===== */
  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;
    background:linear-gradient(135deg,rgba(20,26,34,.62),rgba(20,26,34,.38));
    -webkit-backdrop-filter:blur(26px) saturate(1.8);
    backdrop-filter:blur(26px) saturate(1.8);
    border-bottom:1px solid rgba(255,255,255,.12);
    box-shadow:0 6px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);
  }
  .back-btn{
    display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.2rem;border-radius:60px;
    background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
    -webkit-backdrop-filter:blur(18px) saturate(1.6);
    backdrop-filter:blur(18px) saturate(1.6);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 24px rgba(0,0,0,.3);
    color:#eef2f6;font-size:.9rem;font-weight:500;cursor:pointer;text-decoration:none;transition:.2s;
  }
  .back-btn:hover{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border-color:rgba(64,180,255,.4)}
  .topbar .crumb{color:#6d7f93;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .detail-wrap{max-width:1200px;margin:0 auto;padding:2rem 1.5rem 5rem}
  .detail-wrap .state{text-align:center;padding:6rem 1rem;color:#6d7f93}
  .detail-wrap .state h2{color:#eef2f6;margin-bottom:.5rem;font-weight:600}
  .detail-wrap .state p{margin-bottom:1.2rem;line-height:1.6}

  /* ===== 详情卡片 ===== */
  .detail-card{
    position:relative;
    background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    -webkit-backdrop-filter:blur(28px) saturate(1.8);
    backdrop-filter:blur(28px) saturate(1.8);
    border:1px solid rgba(255,255,255,.14);
    border-radius:32px;overflow:hidden;
    box-shadow:
      0 50px 100px -30px rgba(0,0,0,.8),
      inset 0 1px 0 rgba(255,255,255,.4),
      inset 0 -1px 0 rgba(255,255,255,.08);
    animation:reveal .7s cubic-bezier(.23,1,.32,1) both;
  }
  @keyframes reveal{from{opacity:0;transform:translateY(40px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

  .detail-preview{width:100%;aspect-ratio:21/9;background:#0d1218;position:relative;cursor:zoom-in;overflow:hidden}
  .detail-preview img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
  .detail-preview:hover img{transform:scale(1.03)}
  .detail-preview .badge{position:absolute;bottom:16px;right:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);padding:.35rem .9rem;border-radius:40px;font-size:.78rem;color:#a0c0e0;border:1px solid rgba(255,255,255,.16)}
  .detail-preview .zoom-hint{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);padding:.4rem .8rem;border-radius:40px;font-size:.75rem;color:#c0d0e0;border:1px solid rgba(255,255,255,.16);opacity:0;transition:.3s}
  .detail-preview:hover .zoom-hint{opacity:1}

  .detail-body{padding:2rem 2.2rem 2.2rem;position:relative;z-index:1}
  .detail-id{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.08em;color:#40b4ff;background:rgba(64,180,255,.12);border:1px solid rgba(64,180,255,.3);padding:.3rem .8rem;border-radius:40px;margin-bottom:1rem}
  .detail-title{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;line-height:1.2;letter-spacing:-.02em;margin-bottom:1rem;background:linear-gradient(135deg,#fff 0%,#b0e0ff 60%,#d0a0ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .detail-desc{color:#9fb2c8;font-size:1rem;line-height:1.75;white-space:pre-wrap;margin-bottom:1.8rem}
  .detail-meta{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:2rem}
  .meta-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem 1rem;border-radius:40px;font-size:.82rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#b0c4d8;backdrop-filter:blur(10px)}
  .meta-chip code{font-family:ui-monospace,monospace;color:#7db8ff;font-size:.8rem}

  .links-section h3{font-size:1.1rem;font-weight:600;margin-bottom:1rem;color:#eef2f6;display:flex;align-items:center;gap:.5rem}
  .links-section h3::before{content:"";width:4px;height:18px;border-radius:4px;background:linear-gradient(180deg,#40b4ff,#7b5aff)}
  .links-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
  .link-card{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.1rem 1.3rem;border-radius:20px;
    background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
    -webkit-backdrop-filter:blur(18px) saturate(1.6);
    backdrop-filter:blur(18px) saturate(1.6);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 24px rgba(0,0,0,.3);
    text-decoration:none;color:inherit;transition:.25s;
  }
  .link-card:hover{background:linear-gradient(135deg,rgba(64,180,255,.12),rgba(123,90,255,.06));border-color:rgba(64,180,255,.4);transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 14px 36px rgba(64,180,255,.18)}
  .link-card .link-left{display:flex;align-items:center;gap:.8rem;min-width:0}
  .link-icon{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
  .link-icon.baidu{background:rgba(40,100,200,.2);color:#7db8ff}
  .link-icon.quark{background:rgba(100,200,150,.18);color:#7dffb0}
  .link-icon.default-link{background:rgba(255,255,255,.08);color:#c0d0e0}
  .link-text{min-width:0}
  .link-text .link-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link-text .link-sub{font-size:.75rem;color:#6d7f93;margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link-text .code-badge{display:inline-block;font-family:ui-monospace,monospace;font-size:.72rem;background:rgba(64,180,255,.15);color:#7db8ff;padding:.15rem .5rem;border-radius:20px;margin-top:.3rem}
  .link-go{font-size:1.2rem;color:#4a5a6a;flex-shrink:0;transition:.25s}
  .link-card:hover .link-go{color:#40b4ff;transform:translateX(3px)}

  /* ===== 模态框 ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(16px);z-index:100;display:none;align-items:center;justify-content:center;padding:1.5rem}
  .modal-overlay.active{display:flex}
  .modal{
    max-width:700px;width:100%;max-height:90vh;overflow-y:auto;padding:2rem;border-radius:32px;
    background:linear-gradient(135deg,rgba(30,38,48,.92),rgba(20,26,34,.92));
    -webkit-backdrop-filter:blur(32px) saturate(1.8);
    backdrop-filter:blur(32px) saturate(1.8);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:
      0 50px 100px rgba(0,0,0,.85),
      inset 0 1px 0 rgba(255,255,255,.4),
      inset 0 -1px 0 rgba(255,255,255,.06);
  }
  .modal h2{font-size:1.6rem;margin-bottom:1.5rem;font-weight:700;background:linear-gradient(135deg,#fff,#b0d0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .form-group{margin-bottom:1.2rem}
  .form-group label{display:block;font-size:.85rem;font-weight:500;color:#92a8c0;margin-bottom:.4rem}
  .form-group input,.form-group textarea{
    width:100%;padding:.8rem 1rem;border-radius:16px;
    background:rgba(10,14,20,.55);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
    color:#eef2f6;font-family:inherit;font-size:.95rem;transition:.2s;outline:none;
  }
  .form-group input:focus,.form-group textarea:focus{border-color:#40b4ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 3px rgba(64,180,255,.12)}
  .form-group textarea{min-height:100px;resize:vertical}
  .link-row{display:grid;grid-template-columns:1fr 2fr .8fr auto;gap:.6rem;align-items:center;margin-bottom:.6rem}
  .link-row input{padding:.6rem .8rem;font-size:.85rem}
  .btn-remove-link{background:rgba(255,80,80,.15);border:none;color:#ff8a8a;border-radius:12px;padding:.6rem;cursor:pointer;font-size:1rem;transition:.2s}
  .btn-remove-link:hover{background:rgba(255,80,80,.3)}
  .form-actions{display:flex;gap:1rem;margin-top:2rem;justify-content:flex-end}

  /* ===== 灯箱 ===== */
  .lightbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);backdrop-filter:blur(22px);display:none;align-items:center;justify-content:center;padding:2rem}
  .lightbox.active{display:flex}
  .lightbox img{max-width:92vw;max-height:88vh;border-radius:24px;box-shadow:0 50px 120px rgba(0,0,0,.85);animation:zoomIn .35s cubic-bezier(.23,1,.32,1)}
  @keyframes zoomIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  .lightbox-close{position:absolute;top:1.5rem;right:1.5rem;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  .lightbox-close:hover{background:rgba(255,255,255,.25)}

  /* ===== Toast ===== */
  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(20,30,40,.92);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.14);color:#eef2f6;padding:1rem 2rem;border-radius:60px;font-size:.9rem;z-index:300;opacity:0;transition:.4s cubic-bezier(.23,1,.32,1);box-shadow:0 24px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.22);pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  @media(max-width:700px){
    .toolbar{flex-direction:column;align-items:stretch}
    .card-grid{grid-template-columns:1fr}
    .hero h1{font-size:2.5rem}
    .detail-body{padding:1.5rem 1.3rem 1.8rem}
    .detail-preview{aspect-ratio:16/10}
    .links-list{grid-template-columns:1fr}
    .topbar{padding:.8rem 1rem}
    .link-row{grid-template-columns:1fr 1fr}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="aurora-bg"></div>
<div class="grid-overlay"></div>

<!-- 液态玻璃折射滤镜（Chromium 生效，其他浏览器自动降级为模糊） -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="liquid-lens">
    <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- ===== 列表视图 ===== -->
<div id="listView">
  <section class="hero" id="hero">
    <h1>UE 资源站</h1>
    <p>程序化武器 · 场景资产 · 工具插件 · 一触即达</p>

  <main class="list-section" id="listSection">
    <div class="container">

          <button class="btn btn-outline" id="refreshBtn">⟳ 刷新</button>

<!-- ===== 详情视图 ===== -->

  </div>
  <div class="detail-wrap" id="detailWrap">
    <div class="state"><div class="spinner"></div><p>正在加载资源详情…</p></div>
  </div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">新增资源</h2>
    <form id="resourceForm">
      <input type="hidden" id="editId" value="">
      <div class="form-group"><label>名称 *</label><input type="text" id="formName" required placeholder="例如：程序化武器生成系统"></div>
      <div class="form-group"><label>描述</label><textarea id="formDesc" placeholder="详细描述…"></textarea></div>

      <div class="form-group"><label>预览媒体 URL（图片或视频）</label><input type="text" id="formPreview" placeholder="https://…"></div>
      <div class="form-group">
        <label>下载链接</label>
        <div id="linksContainer"></div>
        <button type="button" class="btn btn-outline btn-sm" id="addLinkBtn" style="margin-top:.5rem">+ 添加链接</button>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" id="cancelModalBtn">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>

  </div>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">×</button>
  <img src="" alt="预览大图" id="lightboxImg">

<div class="toast" id="toast"></div>

<script>
/* ==================== 配置 ==================== */
const REPO_OWNER = 'zhangjiashu210303';
const REPO_NAME  = 'UE-resources';
const BRANCH     = 'main';
const FILE_PATH  = 'assets.json';
const RAW_URL = `https://cdn.jsdelivr.net/gh/${REPO_OWNER}/${REPO_NAME}@${BRANCH}/${FILE_PATH}`;
const CONFIG_URL = './config.json';

/* ==================== 全局 ==================== */
let assets = [];
let currentMode = 'list';
let searchQuery = '';
let isListVisible = false;

const listView = document.getElementById('listView');
const detailView = document.getElementById('detailView');
const hero = document.getElementById('hero');
const listSection = document.getElementById('listSection');
const cardGrid = document.getElementById('cardGrid');
const searchInput = document.getElementById('searchInput');
const refreshBtn = document.getElementById('refreshBtn');
const addBtn = document.getElementById('addBtn');
const publishBtn = document.getElementById('publishBtn');
const detailWrap = document.getElementById('detailWrap');
const crumb = document.getElementById('crumb');
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const resourceForm = document.getElementById('resourceForm');
const editIdInput = document.getElementById('editId');
const formName = document.getElementById('formName');
const formDesc = document.getElementById('formDesc');
const formDownloadDir = document.getElementById('formDownloadDir');
const formPreview = document.getElementById('formPreview');
const linksContainer = document.getElementById('linksContainer');
const addLinkBtn = document.getElementById('addLinkBtn');
const cancelModalBtn = document.getElementById('cancelModalBtn');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');
const toast = document.getElementById('toast');

/* ==================== Token ==================== */
let _configCache = null;

async function loadConfigToken() {
  if (_configCache !== null) return _configCache;
  try {
    const url = CONFIG_URL + '?v=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const cfg = await res.json();
    const p = cfg && cfg.github_token_parts;
    if (!p || !p.a || !p.b || !p.c) {
      throw new Error('config.json 缺少 github_token_parts.a/b/c');
    }
    const token = String(p.a) + String(p.b) + String(p.c);
    _configCache = token;
    console.log('✅ Token 已从 config.json 读取');
    return token;
  } catch (err) {
    console.warn('读取 config.json 失败:', err);
    _configCache = '';
    return '';
  }
}

async function getToken() {
  const cfgToken = await loadConfigToken();
  if (cfgToken) return cfgToken;
  return localStorage.getItem('gh_token') || '';
}

(function saveTokenFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const t = params.get('token');
  if (t) {
    localStorage.setItem('gh_token', t);
    params.delete('token');
    const qs = params.toString();
    const clean = window.location.pathname + (qs ? '?' + qs : '') + window.location.hash;
    if (window.history.replaceState) window.history.replaceState({}, '', clean);
  }
})();

/* ==================== 工具 ==================== */
function showToast(msg, d = 2600) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => toast.classList.remove('show'), d);
}
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}
function isDirectDownload(url) {
  return /\.(zip|rar|7z|png|jpe?g|webp|gif|mp4|webm|mov|uasset|umap|fbx|obj|gltf|glb|blend|psd|pdf|txt|json)(\?.*)?$/i.test(url || '');
}
function linkIconClass(name) {
  if (!name) return 'default-link';
  if (name.includes('百度')) return 'baidu';
  if (name.includes('夸克')) return 'quark';
  return 'default-link';
}
function linkIconEmoji(name) {
  if (!name) return '🔗';
  if (name.includes('百度')) return '☁️';
  if (name.includes('夸克')) return '⚡';
  if (name.includes('蓝奏')) return '🔵';
  if (name.includes('阿里')) return '🟠';
  return '🔗';
}

/* ==================== 读取 assets.json ==================== */
async function loadAssets() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch(RAW_URL, { cache: 'no-cache', signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('JSON 根节点不是数组');
    assets = data;
    return { ok: true };
  } catch (err) {
    clearTimeout(timer);
    console.error('加载失败:', err);
    assets = generatePreviewAssets();
    return { ok: false, error: err.message };
  }
}

function generatePreviewAssets() {
  const names = ['程序化武器生成系统 PWAS','可定制图标包 · 通用','Ultra Dynasty Sky 9.7','废弃地铁站场景包','军事基地场景包','Blockout Tools 关卡原型','BODYCAM FPS KIT V4','专业图标包 Pro Icon Pack','轴心点工具 Pivot Tool','武器定制系统','高级粒子特效包','动态天空系统'];
  const descs = ['基于蓝图的全程序化武器动画框架，支持后坐力、摇摆、瞄准等实时生成。','包含100个独特图标和32个可自定义按钮，平色或渐变选项。','高品质动态天空，包含云层、体积光和天气系统。','废弃地铁站完整场景，包含道具、材质和蓝图。','军事基地场景包，包含建筑、载具和掩体。','轻量级关卡遮挡工具，快速灰盒设计，支持三平面材质。','第一人称视角拍摄套件，模拟执法记录仪效果。','灵活智能的图标工具，适用于物品栏、界面和主菜单。','在虚幻编辑器中修改和烘烤网格枢轴点，27种预设。','完整的武器定制系统，支持配件、皮肤和模块化。','高级Niagara粒子特效合集，包含爆炸、烟雾、魔法等。','动态天空系统，支持昼夜循环和体积云。'];
  const arr = [];
  for (let i = 0; i < 12; i++) {
    const c = document.createElement('canvas');
    c.width = 640; c.height = 400;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0,0,640,400);
    const hue = (i*31)%360;
    g.addColorStop(0, `hsl(${hue},70%,25%)`);
    g.addColorStop(.5, `hsl(${(hue+40)%360},80%,35%)`);
    g.addColorStop(1, `hsl(${(hue+80)%360},75%,20%)`);
    ctx.fillStyle = g; ctx.fillRect(0,0,640,400);
    ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 1;
    for (let x=0;x<640;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,400);ctx.stroke();}
    for (let y=0;y<400;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(640,y);ctx.stroke();}
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = 'bold 32px Inter,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('UE 资源 ' + (i+1), 320, 190);
    ctx.font = '18px Inter,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText('预览示例', 320, 240);
    arr.push({
      id: 'preview-' + (i+1),
      name: names[i] || ('资源 ' + (i+1)),
      desc: descs[i] || '预览示例',
      preview: c.toDataURL('image/png'),
      links: [{ name: '示例网盘', url: '#', code: 'demo' }]
    });
  }
  return arr;
}

/* ==================== 列表渲染 ==================== */
function renderList() {
  if (!assets.length) { cardGrid.innerHTML = '<div class="loading-state"><p>暂无资源</p></div>'; return; }
  const q = searchQuery.toLowerCase().trim();
  const filtered = assets.filter(a => {
    if (!q) return true;
    return (a.name||'').toLowerCase().includes(q) || (a.desc||'').toLowerCase().includes(q) || (a.downloadDir||'').toLowerCase().includes(q);
  });
  if (!filtered.length) { cardGrid.innerHTML = '<div class="loading-state"><p>没有匹配的资源</p></div>'; return; }
  cardGrid.innerHTML = filtered.map((asset, index) => {
    const previewUrl = asset.preview || '';
    const isVideo = /\.(mp4|webm|mov|avi)$/i.test(previewUrl);
    const displayUrl = isVideo ? previewUrl.replace(/\.(mp4|webm|mov|avi)$/i, '.jpg') : previewUrl;
    const linkButtons = (asset.links || []).map(link => {
      const cls = linkIconClass(link.name);
      const code = link.code ? `<span class="code-tag">${escapeHtml(link.code)}</span>` : '';
      return `<a href="${escapeHtml(link.url)}" target="_blank" rel="noopener" class="link-badge ${cls}">${escapeHtml(link.name || '下载')}${code}</a>`;
    }).join('');
    const delay = (index % 12) * 0.06;
    const detailUrl = '?id=' + encodeURIComponent(asset.id);
    return `
      <div class="card" style="animation-delay:${delay}s">
        <a href="${detailUrl}" class="card-preview">
          ${displayUrl ? `<img src="${escapeHtml(displayUrl)}" alt="${escapeHtml(asset.name)}" loading="lazy">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#11171f;color:#4a5a6a;">无预览</div>`}
          ${isVideo ? '<span class="media-badge">🎬 视频</span>' : ''}
          <span class="detail-hint">查看详情 →</span>
        </a>
        <div class="card-content">
          <h3 class="card-title">${escapeHtml(asset.name)}</h3>
          <p class="card-desc">${escapeHtml(asset.desc || '暂无描述')}</p>
          <div class="card-actions">
            ${linkButtons || '<span style="color:#4a5a6a;font-size:.8rem;">暂无链接</span>'}
            <div style="display:flex;gap:.3rem;margin-left:auto">
              <button class="icon-btn edit-btn" data-id="${escapeHtml(asset.id)}" title="编辑">✎</button>
              <button class="icon-btn delete-btn" data-id="${escapeHtml(asset.id)}" title="删除">🗑</button>
            </div>
          </div>
        </div>
      </div>`;
  }).join('');

  // 绑定编辑/删除
  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const a = assets.find(x => String(x.id) === btn.dataset.id);
      if (a) openModal(a);
    });
  });
  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm('确定删除这个资源？')) return;
      assets = assets.filter(x => String(x.id) !== btn.dataset.id);
      renderList();
      showToast('已删除（本地），点「发布」同步到 GitHub');
    });
  });

  // 卡片空间倾斜 + 动态高光
  document.querySelectorAll('.card').forEach(card => {
    let raf = null;
    card.addEventListener('pointermove', e => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const rx = ((y - cy) / cy) * -4;   // 上下倾斜 ±4deg
        const ry = ((x - cx) / cx) * 4;    // 左右倾斜 ±4deg
        card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px) scale(1.005)`;
        card.style.setProperty('--mx', x + 'px');
        card.style.setProperty('--my', y + 'px');
        raf = null;
      });
    });
    card.addEventListener('pointerleave', () => {
      card.style.transform = '';
    });
  });
}

/* ==================== 详情渲染 ==================== */
function renderDetail(asset) {
  crumb.textContent = asset.name || asset.id;
  document.title = (asset.name || 'UE 资源') + ' · 详情';
  const previewUrl = asset.preview || '';
  const isVideo = /\.(mp4|webm|mov|avi)$/i.test(previewUrl);
  let previewHtml;
  if (previewUrl && isVideo) {
    previewHtml = `<div class="detail-preview" style="cursor:pointer" onclick="window.open('${escapeHtml(previewUrl)}','_blank')"><video src="${escapeHtml(previewUrl)}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;"></video><span class="badge">🎬 视频预览</span><span class="zoom-hint">点击播放 ↗</span></div>`;
  } else if (previewUrl) {
    previewHtml = `<div class="detail-preview" id="previewBox"><img src="${escapeHtml(previewUrl)}" alt="${escapeHtml(asset.name)}" loading="lazy"><span class="zoom-hint">点击放大 🔍</span></div>`;
  } else {
    previewHtml = `<div class="detail-preview" style="cursor:default;display:flex;align-items:center;justify-content:center;color:#4a5a6a;background:#0d1218;">暂无预览图</div>`;
  }
  const links = asset.links || [];
  const linksHtml = links.length ? links.map(link => {
    const direct = isDirectDownload(link.url);
    const iconCls = linkIconClass(link.name);
    const iconEmoji = linkIconEmoji(link.name);
    const codeHtml = link.code ? `<span class="code-badge">提取码：${escapeHtml(link.code)}</span>` : '';
    const subText = direct ? '直链下载' : (link.code ? '网盘 · 需要提取码' : '网盘链接');
    return `<a class="link-card" href="${escapeHtml(link.url)}" target="_blank" rel="noopener" ${direct ? 'download' : ''}><div class="link-left"><div class="link-icon ${iconCls}">${iconEmoji}</div><div class="link-text"><div class="link-name">${escapeHtml(link.name || '下载')}</div><div class="link-sub">${subText}</div>${codeHtml}</div></div><span class="link-go">${direct ? '⬇' : '↗'}</span></a>`;
  }).join('') : `<div style="color:#6d7f93;font-size:.9rem;padding:1rem 0;">暂无下载链接</div>`;
  const metaChips = [];
  if (asset.id) metaChips.push(`<span class="meta-chip">ID：<code>${escapeHtml(asset.id)}</code></span>`);
  if (asset.downloadDir) metaChips.push(`<span class="meta-chip">目录：<code>${escapeHtml(asset.downloadDir)}</code></span>`);
  metaChips.push(`<span class="meta-chip">${links.length} 个下载链接</span>`);
  detailWrap.innerHTML = `<article class="detail-card">${previewHtml}<div class="detail-body"><span class="detail-id">UE RESOURCE · ${escapeHtml(asset.id || 'N/A')}</span><h1 class="detail-title">${escapeHtml(asset.name)}</h1><p class="detail-desc">${escapeHtml(asset.desc || '暂无描述')}</p><div class="detail-meta">${metaChips.join('')}</div><div class="links-section"><h3>下载链接</h3><div class="links-list">${linksHtml}</div></div></div></article>`;
  const box = document.getElementById('previewBox');
  if (box) box.addEventListener('click', () => openLightbox(previewUrl));
}
function renderDetailError(title, message) {
  crumb.textContent = title;
  document.title = title + ' · UE 资源';
  detailWrap.innerHTML = `<div class="state" style="padding-top:4rem"><div style="font-size:3rem;margin-bottom:1rem">🧭</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(message)}</p><a class="back-btn" href="./" style="margin-top:.5rem">← 返回资源列表</a></div>`;
}

/* ==================== 灯箱 ==================== */
function openLightbox(url) { if (!url) return; lightboxImg.src = url; lightbox.classList.add('active'); }
lightboxClose.addEventListener('click', () => lightbox.classList.remove('active'));
lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('active'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') lightbox.classList.remove('active'); });

/* ==================== 模态框 ==================== */
function createLinkRow(name = '', url = '', code = '') {
  const row = document.createElement('div');
  row.className = 'link-row';
  row.innerHTML = `<input type="text" class="link-name" placeholder="网盘名称" value="${escapeHtml(name)}"><input type="text" class="link-url" placeholder="链接地址" value="${escapeHtml(url)}"><input type="text" class="link-code" placeholder="提取码" value="${escapeHtml(code)}"><button type="button" class="btn-remove-link" title="删除">✕</button>`;
  row.querySelector('.btn-remove-link').addEventListener('click', () => row.remove());
  return row;
}
function openModal(resource = null) {
  linksContainer.innerHTML = '';
  if (resource) {
    modalTitle.textContent = '编辑资源';
    editIdInput.value = resource.id || '';
    formName.value = resource.name || '';
    formDesc.value = resource.desc || '';
    formDownloadDir.value = resource.downloadDir || '';
    formPreview.value = resource.preview || '';
    (resource.links || []).forEach(l => linksContainer.appendChild(createLinkRow(l.name, l.url, l.code || '')));
    if (!(resource.links || []).length) linksContainer.appendChild(createLinkRow());
  } else {
    modalTitle.textContent = '新增资源';
    editIdInput.value = '';
    formName.value = ''; formDesc.value = ''; formDownloadDir.value = ''; formPreview.value = '';
    linksContainer.appendChild(createLinkRow());
  }
  modalOverlay.classList.add('active');
  formName.focus();
}
function closeModal() { modalOverlay.classList.remove('active'); }
function collectFormData() {
  const id = editIdInput.value || String(Date.now());
  const name = formName.value.trim();
  if (!name) { showToast('请填写资源名称'); return null; }
  const links = [];
  linksContainer.querySelectorAll('.link-row').forEach(row => {
    const n = row.querySelector('.link-name').value.trim();
    const u = row.querySelector('.link-url').value.trim();
    const c = row.querySelector('.link-code').value.trim();
    if (n && u) links.push({ name: n, url: u, ...(c ? { code: c } : {}) });
  });
  return { id, name, desc: formDesc.value.trim(), downloadDir: formDownloadDir.value.trim() || undefined, preview: formPreview.value.trim() || undefined, links };
}

/* ==================== 发布 ==================== */
async function publishToGitHub() {
  let token = await getToken();
  if (!token) {
    token = prompt('config.json 读取失败，请手动输入 GitHub Token（Contents: Read and write）：');
    if (!token) return;
    localStorage.setItem('gh_token', token);
  }
  if (!confirm('确定将当前资源列表发布到 GitHub 吗？')) return;

  const api = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
  try {
    const getRes = await fetch(api + `?ref=${BRANCH}`, { headers: { Authorization: `Bearer ${token}` } });
    if (!getRes.ok) {
      if (getRes.status === 401 || getRes.status === 403) {
        localStorage.removeItem('gh_token');
        _configCache = null;
        throw new Error('Token 无效或权限不足。已清除缓存。');
      }
      throw new Error(`获取文件信息失败: HTTP ${getRes.status}`);
    }
    const info = await getRes.json();
    const content = JSON.stringify(assets, null, 2);
    const b64 = btoa(unescape(encodeURIComponent(content)));
    const putRes = await fetch(api, {
      method: 'PUT',
      headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: '📦 更新资源列表', content: b64, sha: info.sha, branch: BRANCH })
    });
    if (!putRes.ok) throw new Error(`提交失败: HTTP ${putRes.status}`);
    showToast('✅ 已发布到 GitHub');
  } catch (err) {
    console.error(err);
    showToast(`❌ 发布失败：${err.message}`, 5000);
  }
}

/* ==================== 滚动切换 ==================== */
const SWITCH_MS = 780;
const TOUCH_THRESHOLD = 10;
let isAnimating = false;

function enterList() {
  if (isAnimating || isListVisible) return;
  isAnimating = true;
  isListVisible = true;
  document.body.classList.add('list-mode');
  hero.classList.add('hidden');
  listSection.classList.add('visible');
  listSection.scrollTop = 0;
  setTimeout(() => { isAnimating = false; }, SWITCH_MS);
}
function exitList() {
  if (isAnimating || !isListVisible) return;
  isAnimating = true;
  isListVisible = false;
  hero.classList.remove('hidden');
  listSection.classList.remove('visible');
  listSection.scrollTop = 0;
  setTimeout(() => {
    isAnimating = false;
    document.body.classList.remove('list-mode');
  }, SWITCH_MS);
}

window.addEventListener('wheel', (e) => {
  if (currentMode !== 'list' || isAnimating) return;
  const dy = e.deltaY;
  if (Math.abs(dy) < 1) return;
  if (!isListVisible) {
    if (dy > 0) enterList();
  } else {
    if (listSection.scrollTop <= 0 && dy < 0) exitList();
  }
}, { passive: true });

let touchStartY = 0;
window.addEventListener('touchstart', (e) => {
  if (currentMode !== 'list' || isAnimating) return;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchmove', (e) => {
  if (currentMode !== 'list' || isAnimating) return;
  const dy = e.touches[0].clientY - touchStartY;
  if (!isListVisible) {
    if (dy < -TOUCH_THRESHOLD) enterList();
  } else {
    if (listSection.scrollTop <= 0 && dy > TOUCH_THRESHOLD) exitList();
  }
}, { passive: true });

window.addEventListener('pageshow', () => {
  if (currentMode === 'list') listSection.scrollTop = 0;
});

/* ==================== 事件 ==================== */
searchInput.addEventListener('input', e => { searchQuery = e.target.value; renderList(); });
refreshBtn.addEventListener('click', async () => {
  cardGrid.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>正在加载资源…</p></div>';
  _configCache = null;
  const r = await loadAssets();
  renderList();
  showToast(r.ok ? `✅ 已加载 ${assets.length} 个资源` : `⚠️ 加载失败：${r.error}`);
});
addBtn.addEventListener('click', () => openModal(null));
publishBtn.addEventListener('click', publishToGitHub);
cancelModalBtn.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
addLinkBtn.addEventListener('click', () => linksContainer.appendChild(createLinkRow()));
resourceForm.addEventListener('submit', e => {
  e.preventDefault();
  const data = collectFormData();
  if (!data) return;
  const idx = assets.findIndex(a => String(a.id) === String(data.id));
  if (idx !== -1) { assets[idx] = data; showToast('✅ 已更新（本地），点「发布」同步'); }
  else { assets.push(data); showToast('✅ 已新增（本地），点「发布」同步'); }
  closeModal();
  renderList();
});

/* ==================== 入口 ==================== */
function getIdFromUrl() { return new URLSearchParams(window.location.search).get('id') || null; }

(async function init() {
  const id = getIdFromUrl();
  const r = await loadAssets();

  if (id) {
    currentMode = 'detail';
    listView.classList.remove('active');
    detailView.classList.add('active');
    document.body.classList.remove('list-mode');
    window.scrollTo(0, 0);
    const asset = assets.find(a => String(a.id) === String(id));
    if (!asset) renderDetailError('资源不存在', `找不到 ID 为「${id}」的资源。`);
    else renderDetail(asset);
  } else {
    currentMode = 'list';
    detailView.classList.remove('active');
    listView.classList.add('active');
    document.title = 'UE 资源站';
    document.body.classList.add('list-mode');
    if (!r.ok) showToast(`⚠️ 加载失败：${r.error}（已显示预览示例）`, 5000);
    renderList();
    window.scrollTo(0, 0);
    listSection.scrollTop = 0;
    isListVisible = false;
    hero.classList.remove('hidden');
    listSection.classList.remove('visible');
  }
})();
</script>
