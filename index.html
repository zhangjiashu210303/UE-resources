<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>资源下载中心</title>
<style>
  :root{
    --bg:#06070a;
    --text:#e9ebf2;
    --muted:#8b90a4;
    --border:rgba(255,255,255,.08);
    --accent:#7c5cff;
    --accent-2:#4a8bff;
    --gold:#e0a94a;
    --ok:#22d3a5;
    --err:#ff5f6d;
    --radius:18px;
    --anim:.68s;
    --ease:cubic-bezier(.65,0,.35,1);
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }

  /* ============================================
     舞台：两个全屏页叠加
     ============================================ */
  .stage{
    position:fixed;
    inset:0;
    overflow:hidden;
  }

  /* ---------- 主界面 ---------- */
  .hero{
    position:absolute;
    inset:0;
    z-index:2;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 80% 60% at 18% 10%, rgba(124,92,255,.30), transparent 62%),
      radial-gradient(ellipse 70% 55% at 85% 12%, rgba(0,179,255,.24), transparent 60%),
      radial-gradient(ellipse 90% 70% at 50% 108%, rgba(248,87,166,.22), transparent 65%),
      radial-gradient(ellipse 60% 50% at 8% 88%, rgba(34,211,165,.16), transparent 60%),
      linear-gradient(165deg, #0a0b14 0%, #0e0a1c 38%, #0a0e18 72%, #06070a 100%);
    transform:translateY(0);
    transition:transform var(--anim) var(--ease), opacity .45s ease;
    will-change:transform;
  }
  .hero.up{
    transform:translateY(-100%);
    opacity:.25;
  }

  .aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .aurora i{position:absolute;border-radius:50%;filter:blur(120px);will-change:transform}
  .aurora i:nth-child(1){width:48vw;height:48vw;left:-10vw;top:-14vw;background:#7c5cff;opacity:.34;animation:drift1 24s ease-in-out infinite}
  .aurora i:nth-child(2){width:42vw;height:42vw;right:-8vw;top:-4vw;background:#00b3ff;opacity:.24;animation:drift2 28s ease-in-out infinite}
  .aurora i:nth-child(3){width:46vw;height:46vw;left:18vw;bottom:-24vw;background:#f857a6;opacity:.20;animation:drift3 32s ease-in-out infinite}
  .aurora i:nth-child(4){width:34vw;height:34vw;right:12vw;bottom:-12vw;background:#22d3a5;opacity:.16;animation:drift4 26s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(7vw,6vw) scale(1.14)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8vw,8vw) scale(1.1)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5vw,-7vw) scale(1.16)}}
  @keyframes drift4{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-6vw,-5vw) scale(1.12)}}

  .mesh{
    position:absolute;inset:0;pointer-events:none;opacity:.55;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:72px 72px;
    -webkit-mask-image:radial-gradient(ellipse 78% 62% at 50% 40%,#000 15%,transparent 78%);
    mask-image:radial-gradient(ellipse 78% 62% at 50% 40%,#000 15%,transparent 78%);
  }

  .topbar{
    position:relative;z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:20px 30px;
    max-width:1400px;width:100%;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .logo{
    width:44px;height:44px;flex:none;border-radius:14px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 12px 34px -10px rgba(124,92,255,.95),inset 0 1px 0 rgba(255,255,255,.4);
    font-size:20px;color:#fff;
  }
  .brand h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.3px}
  .top-actions{display:flex;gap:10px;flex:none}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 18px;border-radius:12px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.05);
    color:var(--text);font-size:13.5px;font-weight:550;
    font-family:inherit;cursor:pointer;white-space:nowrap;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:transform .25s cubic-bezier(.4,0,.2,1),background .25s,box-shadow .25s,border-color .25s;
  }
  .btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
  .btn:active{transform:translateY(0) scale(.985)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border-color:transparent;color:#fff;
    box-shadow:0 12px 30px -12px rgba(124,92,255,.95),inset 0 1px 0 rgba(255,255,255,.3);
  }
  .btn.primary:hover{box-shadow:0 18px 42px -14px rgba(124,92,255,1)}
  .btn svg{width:15px;height:15px;flex:none}

  .hero-center{
    position:relative;z-index:5;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 28px 80px;
  }

  .hero-badge{
    display:inline-flex;align-items:center;gap:9px;
    padding:8px 18px;border-radius:999px;
    border:1px solid rgba(124,92,255,.4);
    background:rgba(124,92,255,.12);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    font-size:12px;color:#c8bcff;letter-spacing:.6px;
    margin-bottom:34px;
  }
  .hero-badge .pulse{
    width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 12px var(--ok);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}

  .hero h2{
    margin:0 0 22px;
    font-size:clamp(34px,6.2vw,68px);
    font-weight:720;
    line-height:1.1;
    letter-spacing:-1.2px;
    background:linear-gradient(175deg,#ffffff 20%,#b8aef0 65%,#7fb6ff 110%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero-desc{
    margin:0 auto 64px;
    max-width:540px;
    font-size:16px;line-height:1.85;
    color:var(--muted);
  }

  .hero-scroll{
    display:inline-flex;flex-direction:column;align-items:center;gap:10px;
    font-size:11px;color:#5f6577;letter-spacing:2px;text-transform:uppercase;
    animation:heroFloat 2.8s ease-in-out infinite;
    pointer-events:none;
  }
  .hero-scroll .chev{
    width:36px;height:36px;border-radius:50%;
    display:grid;place-items:center;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04);
  }
  .hero-scroll svg{width:17px;height:17px;opacity:.8}
  @keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

  /* ---------- 列表页 ---------- */
  .list-section{
    position:absolute;
    inset:0;
    z-index:1;
    overflow-y:auto;
    overflow-x:hidden;
    background:var(--bg);
    transform:translateY(100%);
    transition:transform var(--anim) var(--ease);
    will-change:transform;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .list-section.active{
    transform:translateY(0);
  }
  .list-section::before{
    content:'';
    position:absolute;
    top:14px;left:50%;
    transform:translateX(-50%);
    width:44px;height:4px;
    border-radius:2px;
    background:rgba(255,255,255,.16);
    pointer-events:none;
  }

  .list-inner{
    max-width:1360px;
    margin:0 auto;
    padding:40px 28px 100px;
  }

  .toolbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    flex-wrap:wrap;margin-bottom:24px;
  }
  .toolbar-left{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .toolbar-right{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .pill{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 16px;border-radius:12px;
    border:1px solid var(--border);background:rgba(255,255,255,.04);
    font-size:12.5px;color:var(--muted);
  }
  .pill b{color:var(--text);font-weight:650}

  .search{
    width:240px;padding:11px 16px;
    border-radius:12px;border:1px solid var(--border);
    background:rgba(255,255,255,.04);color:var(--text);
    font-size:13.5px;font-family:inherit;outline:none;
    transition:border-color .25s,box-shadow .25s,background .25s;
  }
  .search::placeholder{color:#666b7e}
  .search:focus{border-color:rgba(124,92,255,.65);background:rgba(124,92,255,.08);box-shadow:0 0 0 4px rgba(124,92,255,.15)}
  .search:disabled{opacity:.4;cursor:not-allowed}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(252px,1fr));
    gap:22px;
  }
  .card{
    position:relative;
    display:flex;flex-direction:column;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(255,255,255,.018));
    overflow:hidden;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    animation:cardIn .55s cubic-bezier(.2,.85,.3,1) backwards;
    transition:transform .45s cubic-bezier(.4,0,.2,1),border-color .4s,box-shadow .45s;
  }
  .card:hover{
    transform:translateY(-6px);
    border-color:rgba(124,92,255,.55);
    box-shadow:0 30px 60px -28px rgba(0,0,0,.98),0 0 0 1px rgba(124,92,255,.25),0 0 40px -16px rgba(124,92,255,.6);
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

  .thumb{
    position:relative;aspect-ratio:4/3;overflow:hidden;
    background:linear-gradient(135deg,rgba(124,92,255,.16),rgba(0,179,255,.09)),#0c0e15;
    display:grid;place-items:center;
    border-bottom:1px solid var(--border);
  }
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .65s cubic-bezier(.2,.8,.3,1)}
  .card:hover .thumb img{transform:scale(1.07)}
  .thumb.previewable{cursor:zoom-in}
  .thumb .ph{font-size:12.5px;color:#5b6178;letter-spacing:.5px;padding:0 12px;text-align:center}
  .thumb-veil{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,transparent 48%,rgba(6,7,10,.75));
  }

  .badge{
    position:absolute;top:11px;left:11px;
    font-size:10.5px;font-weight:700;letter-spacing:.7px;
    padding:4px 9px;border-radius:7px;
    background:rgba(0,0,0,.7);
    border:1px solid rgba(255,255,255,.15);
    color:#c8ccd2;text-transform:uppercase;
    backdrop-filter:blur(8px);
  }
  .badge.image{color:#8ab6f0;border-color:rgba(138,182,240,.45)}
  .badge.video{color:#f0a97a;border-color:rgba(240,169,122,.45)}
  .badge.file{color:#a9adb4}

  .pan-tag{
    position:absolute;top:11px;right:11px;
    font-size:10.5px;font-weight:700;letter-spacing:.5px;
    padding:4px 9px;border-radius:7px;
    background:rgba(224,169,74,.18);
    border:1px solid rgba(224,169,74,.55);
    color:var(--gold);
    backdrop-filter:blur(8px);
  }

  .meta{padding:16px 17px 14px;flex:1;min-width:0}
  .name{
    font-size:14px;font-weight:600;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:8px;
  }
  .dir{
    display:flex;align-items:center;gap:7px;
    font-size:11.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .dir svg{width:12px;height:12px;flex:none;opacity:.75}
  .dir span{overflow:hidden;text-overflow:ellipsis}

  .ops{display:flex;gap:8px;padding:0 17px 17px}
  .act{
    flex:1;padding:10px 10px;border-radius:11px;
    border:1px solid var(--border);background:rgba(255,255,255,.04);
    color:var(--text);font-size:12.5px;font-weight:550;font-family:inherit;
    cursor:pointer;transition:.25s;
  }
  .act:hover{background:rgba(255,255,255,.11)}
  .act:disabled{opacity:.4;cursor:not-allowed}
  .act:disabled:hover{background:rgba(255,255,255,.04)}
  .act.primary{
    background:linear-gradient(135deg,rgba(124,92,255,.92),rgba(74,139,255,.92));
    border-color:transparent;color:#fff;
    box-shadow:0 10px 24px -12px rgba(124,92,255,.95);
  }
  .act.primary:hover{filter:brightness(1.13)}
  .act.pan{
    background:linear-gradient(135deg,rgba(224,169,74,.94),rgba(214,132,45,.94));
    border-color:transparent;color:#2a1e05;
    box-shadow:0 10px 24px -12px rgba(224,169,74,.95);
  }
  .act.pan:hover{filter:brightness(1.1)}

  .skel{background:linear-gradient(90deg,#12141a 25%,#1c1f27 37%,#12141a 63%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .skel-card{border-color:rgba(255,255,255,.05);animation:none}
  .skel-thumb{aspect-ratio:4/3;border-bottom:1px solid var(--border)}
  .skel-body{padding:16px 17px 17px}
  .skel-line{height:11px;border-radius:5px;margin-bottom:10px}
  .skel-line:last-child{margin-bottom:0}

  .sentinel{grid-column:1/-1;height:1px}

  .noresult{
    grid-column:1/-1;text-align:center;padding:70px 20px;
    color:var(--muted);font-size:14px;
  }

  /* 灯箱 */
  .lightbox{
    position:fixed;inset:0;z-index:200;
    display:grid;place-items:center;padding:40px;
    background:rgba(3,4,8,.9);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    opacity:0;pointer-events:none;transition:opacity .35s;
  }
  .lightbox.on{opacity:1;pointer-events:auto}
  .lightbox img,.lightbox video{
    max-width:88vw;max-height:76vh;
    border-radius:16px;display:block;
    box-shadow:0 50px 120px -35px #000;
    transform:scale(.93);transition:transform .4s cubic-bezier(.2,.8,.3,1);
    background:#000;
  }
  .lightbox.on img,.lightbox.on video{transform:scale(1)}
  .lb-caption{
    position:fixed;bottom:36px;left:50%;transform:translateX(-50%);
    text-align:center;font-size:13px;color:var(--muted);max-width:80vw;
  }
  .lb-caption b{color:var(--text);font-weight:600;display:block;margin-bottom:4px;font-size:14px}
  .lb-close{
    position:fixed;top:26px;right:28px;
    width:42px;height:42px;border-radius:13px;
    display:grid;place-items:center;
    border:1px solid var(--border);background:rgba(255,255,255,.07);
    color:var(--text);cursor:pointer;font-size:18px;line-height:1;
    backdrop-filter:blur(10px);
    transition:.25s;
  }
  .lb-close:hover{background:rgba(255,255,255,.16);transform:rotate(90deg)}

  /* Toast */
  .toasts{
    position:fixed;right:24px;bottom:24px;z-index:300;
    display:flex;flex-direction:column;gap:10px;align-items:flex-end;
  }
  .toast{
    display:flex;align-items:center;gap:11px;
    padding:14px 19px;border-radius:14px;
    border:1px solid var(--border);
    background:rgba(18,20,30,.94);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    font-size:13px;color:var(--text);
    box-shadow:0 24px 52px -20px rgba(0,0,0,.98);
    animation:toastIn .4s cubic-bezier(.2,.8,.3,1);
    max-width:400px;
  }
  .toast.out{animation:toastOut .3s forwards}
  .toast .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--accent)}
  .toast.success .dot{background:var(--ok);box-shadow:0 0 12px var(--ok)}
  .toast.error .dot{background:var(--err);box-shadow:0 0 12px var(--err)}
  @keyframes toastIn{from{opacity:0;transform:translateX(44px) scale(.93)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateX(44px) scale(.93)}}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.11);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);background-clip:padding-box}

  @media (max-width:820px){
    .topbar{padding:16px 18px}
    .brand p{display:none}
    .hero-center{padding:0 18px 60px}
    .hero-desc{margin-bottom:52px}
    .list-inner{padding:36px 18px 80px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
    .search{width:100%}
    .toolbar{align-items:stretch}
    .toolbar-right{width:100%}
    .toasts{right:14px;left:14px;bottom:14px;align-items:stretch}
  }
</style>
</head>
<body>

<div class="stage">

  <!-- ============================================
       主界面
       ============================================ -->
  <div class="hero" id="heroEl">
    <div class="aurora"><i></i><i></i><i></i><i></i></div>
    <div class="mesh"></div>

    <header class="topbar">
      <div class="brand">
        <div class="logo">◈</div>
        <div>
          <h1>资源下载中心</h1>
          <p>所有内容 · 一处获取</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn" id="reloadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          刷新
        </button>
      </div>
    </header>

    <div class="hero-center">
      <div class="hero-badge">
        <span class="pulse"></span>
        <span id="heroBadgeText">资源在线</span>
      </div>

      <h2>下载你需要的<br>每一份资源</h2>
      <p class="hero-desc">图片、视频、素材合集，点一下就能保存到本地。<br>向下滑动查看全部内容。</p>

      <div class="hero-scroll">
        <div class="chev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <span>向下滑动</span>
      </div>
    </div>
  </div>

  <!-- ============================================
       列表页
       ============================================ -->
  <section class="list-section" id="listEl">
    <div class="list-inner">

      <div class="toolbar">
        <div class="toolbar-left">
          <div class="pill" id="count">共 <b>—</b> 项</div>
        </div>
        <div class="toolbar-right">
          <input class="search" id="search" placeholder="搜索名称或目录" autocomplete="off" disabled>
          <button class="btn primary" id="allBtn" disabled>全部下载</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>

    </div>
  </section>

</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <div id="lbBody"></div>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<div class="toasts" id="toasts"></div>

<script>
(function () {
  'use strict';

  /* ============ 配置 ============ */
  var JSON_URL = './assets.json';
  var BATCH = 12;
  var ANIM_MS = 700;   /* 与 CSS 里 --anim 对齐 */

  var PAN_LIST = [
    { host: 'pan.baidu.com',      name: '百度网盘' },
    { host: 'yun.baidu.com',      name: '百度网盘' },
    { host: 'eyun.baidu.com',     name: '百度网盘' },
    { host: 'aliyundrive.com',    name: '阿里云盘' },
    { host: 'alipan.com',         name: '阿里云盘' },
    { host: 'pan.quark.cn',       name: '夸克网盘' },
    { host: 'weiyun.com',         name: '腾讯微云' },
    { host: 'lanzou.com',         name: '蓝奏云' },
    { host: 'lanzoui.com',        name: '蓝奏云' },
    { host: 'lanzoux.com',        name: '蓝奏云' },
    { host: 'lanzouw.com',        name: '蓝奏云' },
    { host: 'lanzoup.com',        name: '蓝奏云' },

  var IMG_EXT = { png:1, jpg:1, jpeg:1, gif:1, webp:1, bmp:1, svg:1, avif:1, tga:1, exr:1, hdr:1, psd:1, ico:1 };

  /* ============ 工具 ============ */

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function extOf(str) {
    if (!str) return '';
    var clean = String(str).split('#')[0].split('?')[0];
    var dot = clean.lastIndexOf('.');
    var slash = clean.lastIndexOf('/');
    if (dot < 0 || dot < slash) return '';
    return clean.slice(dot + 1).toLowerCase();
  }

  function guessType(url, field) {
    var e = extOf(url);
    if (IMG_EXT[e]) return 'image';
    if (VID_EXT[e]) return 'video';
    if (/^data:image\//i.test(url)) return 'image';
    if (/^data:video\//i.test(url)) return 'video';
    if (field === 'video' || /video/i.test(field)) return 'video';
    if (field === 'image' || field === 'img' || field === 'picture' || field === 'pic') return 'image';
    return 'file';
  }

  function detectPan(url) {
    if (!url || url.indexOf('data:') === 0) return null;
    var host;
    try {
      host = new URL(url, location.href).hostname.toLowerCase().replace(/^www\./, '');
    } catch (e) { return null; }
    for (var i = 0; i < PAN_LIST.length; i++) {
      var h = PAN_LIST[i].host;
      if (host === h || host.slice(-(h.length + 1)) === '.' + h) {
        return PAN_LIST[i].name;
      }
    }
    return null;
  }

  function pick(obj, keys) {
    for (var i = 0; i < keys.length; i++) {
      var v = obj[keys[i]];
      if (v !== undefined && v !== null && v !== '') return v;
    }
    return null;
  }

  function pickUrl(obj) {
    for (var i = 0; i < URL_KEYS.length; i++) {
      var key = URL_KEYS[i];
      var v = obj[key];
      if (v === undefined || v === null || v === '') continue;
      if (typeof v === 'object') {
        v = v.url || v.href || v.src || v.base64 || v.data || null;
        if (!v) continue;
      }
      return { value: String(v).trim(), field: key };
    }
    return null;
  }

  function normalize(raw) {
    if (typeof raw === 'string') {
      var t = raw.trim();
      return { name: '', dir: '', url: t, type: guessType(t, ''), pan: detectPan(t) };
    }
    if (!raw || typeof raw !== 'object') return null;

    var name = pick(raw, NAME_KEYS);
    var dir  = pick(raw, DIR_KEYS);
    var found = pickUrl(raw);

    if (!found || !found.value) {
      return { name: name ? String(name) : '', dir: dir ? String(dir) : '', url: '', type: 'file', pan: null };
    }

    var url = found.value;
    return {
      name: name ? String(name) : '',
      dir: dir ? String(dir) : '',
      url: url,
      type: guessType(url, found.field),
      pan: detectPan(url)
    };
  }

  function isDataUrl(u) { return u.indexOf('data:') === 0; }

  function extFromMime(mime) {
    var map = {
      'image/png':'png','image/jpeg':'jpg','image/jpg':'jpg','image/gif':'gif',
      'image/webp':'webp','image/bmp':'bmp','image/svg+xml':'svg','image/avif':'avif',
      'video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov','video/x-msvideo':'avi'
    };
    return map[mime] || '';
  }

  function dataUrlToBlob(dataUrl) {
    var comma = dataUrl.indexOf(',');
    var head = dataUrl.slice(5, comma);
    var body = dataUrl.slice(comma + 1);
    var isB64 = /;base64/i.test(head);
    var mime = head.split(';')[0] || 'application/octet-stream';
    var bytes;
    if (isB64) {
      var bin = atob(body);
      bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    } else {
      bytes = new TextEncoder().encode(decodeURIComponent(body));
    }
    return new Blob([bytes], { type: mime });
  }

  function filenameFor(item, mime) {
    var base = (item.name || '').trim();
    if (!base) {
      if (item.url) {
        var clean = item.url.split('#')[0].split('?')[0];
        var idx = clean.lastIndexOf('/');
        base = idx >= 0 ? clean.slice(idx + 1) : clean;
        try { base = decodeURIComponent(base); } catch (e) {}
      }
      if (!base) base = 'file';
    }
    base = base.replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_');
    if (/\.[A-Za-z0-9]{1,6}$/.test(base)) return base;

    var ext = extFromMime(mime) || extOf(item.url) || extOf(item.name) ||
              (item.type === 'video' ? 'mp4' : item.type === 'image' ? 'png' : 'bin');
    return base + '.' + ext;
  }

  function makePreviewCard(name, dir, colors, num) {
    var cv = document.createElement('canvas');
    cv.width = 800;
    cv.height = 600;
    var ctx = cv.getContext('2d');

    var g = ctx.createLinearGradient(0, 0, 800, 600);
    g.addColorStop(0, colors[0]);
    g.addColorStop(1, colors[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 800, 600);

    ctx.globalAlpha = 0.14;
    ctx.fillStyle = '#ffffff';
    for (var k = 0; k < 6; k++) {
      ctx.beginPath();
      ctx.arc(
        (num * 97 + k * 173) % 800,
        (num * 61 + k * 131) % 600,
        60 + ((k * 37) % 130),
        0, Math.PI * 2
      );
      ctx.fill();
    }

    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    for (var x = 40; x < 800; x += 80) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 600); ctx.stroke();
    }
    for (var y = 40; y < 600; y += 80) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.font = '700 128px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(num).padStart(2, '0'), 400, 300);

    return {
      name: name,
      downloadDir: dir,
      url: cv.toDataURL('image/jpeg', 0.85)
    };
  }

  function boot() {
    if (io) { io.disconnect(); io = null; }
    items = [];
    filtered = [];

    countEl.innerHTML = '共 <b>—</b> 项';
    searchEl.disabled = true;
    allBtn.disabled = true;
    searchEl.value = '';
    showSkeleton(8);

    fetch(JSON_URL, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('bad status');
        return r.text();
      })
      .then(function (text) {
        if (!text.trim()) throw new Error('empty');
        var data = JSON.parse(text);
        var list;
        if (Array.isArray(data))                     list = data;
        else if (data && Array.isArray(data.items))  list = data.items;
        else if (data && Array.isArray(data.list))   list = data.list;
        else if (data && Array.isArray(data.assets)) list = data.assets;
        else if (data && Array.isArray(data.files))  list = data.files;
        else if (data && Array.isArray(data.images)) list = data.images;
        else if (data && Array.isArray(data.data))   list = data.data;
        else if (data && typeof data === 'object')   list = [data];
        else throw new Error('bad shape');

        var parsed = [];
        for (var i = 0; i < list.length; i++) {
          var n = normalize(list[i]);
          if (n) parsed.push(n);
        }
        if (!parsed.length) throw new Error('empty list');

        items = parsed;
        onLoaded(false);
      })
      .catch(function () {
        items = makePreviewItems().map(normalize);
        onLoaded(true);
      });
  }

  function onLoaded(isPreview) {
    searchEl.disabled = false;
    allBtn.disabled = false;
    $('heroBadgeText').textContent = isPreview ? '预览模式' : '资源在线';
    resetAndRender();

  /* ============ 渲染 ============ */

  function resetAndRender() {
    if (io) { io.disconnect(); io = null; }
    if (sentinel && sentinel.parentNode) sentinel.remove();

    var q = searchEl.value.trim().toLowerCase();
    filtered = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var hay = (it.name + ' ' + it.dir + ' ' + it.url).toLowerCase();
      if (!q || hay.indexOf(q) !== -1) filtered.push(i);
    }

    gridEl.innerHTML = '';
    loadedPos = 0;

    if (!filtered.length) {
      gridEl.innerHTML = '<div class="noresult">没有匹配的条目</div>';
      updateCount(q);
      return;
    }

    sentinel = document.createElement('div');
    sentinel.className = 'sentinel';

    loadMore(q);
  }

  function loadMore(q) {
    if (loadedPos >= filtered.length) return;

    var end = Math.min(loadedPos + BATCH, filtered.length);
    var frag = document.createDocumentFragment();

    for (var k = loadedPos; k < end; k++) {
      frag.appendChild(buildCard(items[filtered[k]], filtered[k], k - loadedPos));
    }
    loadedPos = end;
    gridEl.appendChild(frag);

    if (loadedPos < filtered.length) {
      if (!io) {
        io = new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting) loadMore(searchEl.value.trim().toLowerCase());
        }, { root: listEl, rootMargin: '500px 0px' });
      }
      gridEl.appendChild(sentinel);
      io.observe(sentinel);
    } else {
      if (io) { io.disconnect(); io = null; }
      if (sentinel && sentinel.parentNode) sentinel.remove();
    }

    updateCount(q);
  }

  function updateCount(q) {
    var txt = '共 <b>' + items.length + '</b> 项';
    if (q) txt += '　匹配 <b>' + filtered.length + '</b> 项';
    countEl.innerHTML = txt;
  }

  function buildCard(item, idx, order) {
    var card = document.createElement('article');
    card.className = 'card';
    card.dataset.i = idx;
    card.style.animationDelay = Math.min(order * 40, 320) + 'ms';

    var hasUrl = !!item.url;
    var isPan = !!item.pan;
    var canPreview = hasUrl && !isPan && (item.type === 'image' || item.type === 'video');

    var thumb = document.createElement('div');
    thumb.className = 'thumb';

    if (canPreview && item.type === 'image') {
      var img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.src = item.url;
      img.addEventListener('error', function () {
        img.remove();
        var ph = document.createElement('span');
        ph.className = 'ph';
        ph.textContent = '预览不可用';
        thumb.appendChild(ph);
        thumb.classList.remove('previewable');
        thumb.style.cursor = 'default';
      });
      thumb.appendChild(img);
      thumb.classList.add('previewable');

      var veil = document.createElement('div');
      veil.className = 'thumb-veil';
      thumb.appendChild(veil);
    } else if (canPreview && item.type === 'video') {
      var v = document.createElement('video');
      v.muted = true;
      v.preload = 'metadata';
      v.src = item.url;
      v.addEventListener('error', function () {
        v.remove();
        var ph2 = document.createElement('span');
        ph2.className = 'ph';
        ph2.textContent = '预览不可用';
        thumb.appendChild(ph2);
        thumb.classList.remove('previewable');
        thumb.style.cursor = 'default';
      });
      thumb.appendChild(v);
      thumb.classList.add('previewable');

      var veil2 = document.createElement('div');
      veil2.className = 'thumb-veil';
      thumb.appendChild(veil2);
    } else {
      var ph3 = document.createElement('span');
      ph3.className = 'ph';
      ph3.textContent = isPan ? item.pan + ' 分享' : (hasUrl ? '暂无预览' : '暂无内容');
      thumb.appendChild(ph3);
    }

    var badge = document.createElement('span');
    badge.className = 'badge ' + item.type;
    badge.textContent = item.type;
    thumb.appendChild(badge);

    if (isPan) {
      var tag = document.createElement('span');
      tag.className = 'pan-tag';
      tag.textContent = item.pan;
      thumb.appendChild(tag);
    }

    var meta = document.createElement('div');
    meta.className = 'meta';

    var displayName = item.name || '未命名';
    var dirText = item.dir || '默认下载目录';

    meta.innerHTML =
      '<div class="name" title="' + esc(displayName) + '">' + esc(displayName) + '</div>' +
      '<div class="dir">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>' +
        '</svg>' +
        '<span title="' + esc(dirText) + '">' + esc(dirText) + '</span>' +
      '</div>';

    var ops = document.createElement('div');
    ops.className = 'ops';

    var btnView = '<button class="act" data-act="view" data-i="' + idx + '"' +
      (canPreview ? '' : ' disabled') + '>预览</button>';

    var btnMain = isPan
      ? '<button class="act pan" data-act="pan" data-i="' + idx + '">打开网盘</button>'
      : '<button class="act primary" data-act="dl" data-i="' + idx + '"' +
          (hasUrl ? '' : ' disabled') + '>下载</button>';

    ops.innerHTML = btnView + btnMain;

    card.appendChild(thumb);
    card.appendChild(meta);
    card.appendChild(ops);
    return card;
  }

  /* ============ 下载 ============ */

  function browserDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
  }

  function browserDownloadUrl(url, filename) {
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function openPan(item) {
    if (!item || !item.url) return;
    var w = window.open(item.url, '_blank', 'noopener');
    if (!w) {
      toast('浏览器拦截了新窗口，请允许弹出窗口', 'error', 4200);
    } else {
      toast('已打开 ' + item.pan, 'success');
    }
  }

  async function downloadItem(item) {
    if (!item || !item.url) { toast('该项没有可下载的内容', 'error'); return 'fail'; }
    if (item.pan) { openPan(item); return 'pan'; }

    var url = item.url;

    if (isDataUrl(url)) {
      var blob;
      try { blob = dataUrlToBlob(url); }
      catch (e) { toast('内容无法读取', 'error'); return 'fail'; }

      var fname = filenameFor(item, blob.type);
      browserDownload(blob, fname);
      toast('已开始下载 ' + fname, 'success');
      return 'ok';
    }

    var fname2 = filenameFor(item, '');
    browserDownloadUrl(url, fname2);
    toast('已开始下载 ' + fname2, 'success');
    return 'ok';
  }

  async function downloadAll() {
    var direct = [];
    var panCount = 0;

    for (var i = 0; i < items.length; i++) {
      if (!items[i].url) continue;
      if (items[i].pan) panCount++;
      else direct.push(items[i]);
    }

    if (!direct.length) {
      if (panCount) toast('当前列表都是网盘链接，请逐个打开', 'error', 4200);
      else toast('没有可下载的内容', 'error');
      return;
    }

    var label = allBtn.textContent;
    allBtn.disabled = true;

    var done = 0, fail = 0;

    for (var n = 0; n < direct.length; n++) {
      allBtn.textContent = '下载中 ' + (n + 1) + '/' + direct.length;
      var r = await downloadItem(direct[n]);
      if (r === 'ok') done++;
      else fail++;
      await new Promise(function (resolve) { setTimeout(resolve, 180); });
    }

    allBtn.disabled = false;
    allBtn.textContent = label;

    var msg = '完成：成功 ' + done + ' 项';
    if (fail) msg += '，失败 ' + fail + ' 项';
    if (panCount) msg += '；' + panCount + ' 个网盘链接需手动打开';
    toast(msg, fail ? 'error' : 'success', 5000);
  }

  /* ============ 预览 ============ */

  function openLightbox(item) {
    if (!item || !item.url) return;
    if (item.pan) { openPan(item); return; }
    if (item.type !== 'image' && item.type !== 'video') {
      toast('该项暂不支持预览', 'error');
      return;
    }

    lbBody.innerHTML = '';

    if (item.type === 'video') {
      var v = document.createElement('video');
      v.src = item.url;
      v.controls = true;
      v.autoplay = true;
      lbBody.appendChild(v);
    } else {
      var img = document.createElement('img');
      img.src = item.url;
      img.alt = '';
      lbBody.appendChild(img);
    }

    var nm = item.name || '预览';
    lbCap.innerHTML = '<b>' + esc(nm) + '</b>' + esc(item.dir || '默认下载目录');
    lightbox.classList.add('on');
  }

  function closeLightbox() {
    lightbox.classList.remove('on');
    setTimeout(function () { lbBody.innerHTML = ''; }, 300);
  }

  /* ============ 事件 ============ */

  $('reloadBtn').addEventListener('click', boot);

  var searchTimer;
  searchEl.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(resetAndRender, 160);
  });

  gridEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (btn) {
      var act = btn.dataset.act;
      var item = items[+btn.dataset.i];
      if (act === 'dl') downloadItem(item);
      else if (act === 'pan') openPan(item);
      else if (act === 'view') openLightbox(item);
      return;
    }
    var thumb = e.target.closest('.thumb.previewable');
    if (thumb) {
      var card = thumb.closest('.card');
      if (!card) return;
      var it = items[+card.dataset.i];
      if (it) openLightbox(it);
    }
  });

  allBtn.addEventListener('click', downloadAll);

  $('lbClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) closeLightbox();
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && lightbox.classList.contains('on')) closeLightbox();
  });

  /* 开屏加载 */
  boot();
})();
</script>
</body>
</html>
