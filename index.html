<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UE 资源详情</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    background:#0a0c0f;color:#eef2f6;
    min-height:100vh;overflow-x:hidden;
  }
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:#101418}
  ::-webkit-scrollbar-thumb{background:#2e3a47;border-radius:20px}
  ::-webkit-scrollbar-thumb:hover{background:#3f5062}

  /* 背景层 */
  .aurora-bg{
    position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(circle at 20% 20%,rgba(64,180,255,.18),transparent 45%),
      radial-gradient(circle at 80% 80%,rgba(170,80,255,.2),transparent 50%),
      radial-gradient(circle at 45% 65%,rgba(0,255,200,.1),transparent 55%),
      #0a0c0f;
    filter:blur(40px);
  }
  .grid-overlay{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
    background-size:40px 40px;
  }

  /* 顶部返回栏 */
  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:1rem;
    padding:1rem 1.5rem;
    background:rgba(10,12,15,.55);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .back-btn{
    display:inline-flex;align-items:center;gap:.5rem;
    padding:.6rem 1.2rem;border-radius:60px;
    border:1px solid rgba(255,255,255,.12);
    background:transparent;color:#eef2f6;
    font-size:.9rem;font-weight:500;cursor:pointer;
    text-decoration:none;transition:.2s;
  }
  .back-btn:hover{background:rgba(255,255,255,.06);border-color:#40b4ff}
  .topbar .crumb{
    color:#6d7f93;font-size:.85rem;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* 主体 */
  .detail-wrap{
    max-width:1200px;margin:0 auto;
    padding:2rem 1.5rem 5rem;
  }

  /* 加载/错误 */
  .state{
    text-align:center;padding:6rem 1rem;color:#6d7f93;
  }
  .spinner{
    display:inline-block;width:38px;height:38px;
    border:3px solid rgba(64,180,255,.15);
    border-top-color:#40b4ff;border-radius:50%;
    animation:spin .8s linear infinite;margin-bottom:1rem;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .state h2{color:#eef2f6;margin-bottom:.5rem;font-weight:600}
  .state p{margin-bottom:1.2rem;line-height:1.6}

  /* 详情卡片 */
  .detail-card{
    background:rgba(20,26,34,.72);
    backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.07);
    border-radius:32px;
    overflow:hidden;
    box-shadow:0 40px 80px -20px rgba(0,0,0,.7);
    animation:reveal .7s cubic-bezier(.23,1,.32,1) both;
  }
  @keyframes reveal{
    from{opacity:0;transform:translateY(40px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  /* 预览区 */
  .detail-preview{
    width:100%;aspect-ratio:21/9;
    background:#0d1218;position:relative;
    cursor:zoom-in;overflow:hidden;
  }
  .detail-preview img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .6s;
  }
  .detail-preview:hover img{transform:scale(1.03)}
  .detail-preview .badge{
    position:absolute;bottom:16px;right:16px;
    background:rgba(0,0,0,.65);backdrop-filter:blur(8px);
    padding:.35rem .9rem;border-radius:40px;
    font-size:.78rem;color:#a0c0e0;
    border:1px solid rgba(255,255,255,.1);
  }
  .detail-preview .zoom-hint{
    position:absolute;top:16px;right:16px;
    background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
    padding:.4rem .8rem;border-radius:40px;
    font-size:.75rem;color:#c0d0e0;
    border:1px solid rgba(255,255,255,.1);
    opacity:0;transition:.3s;
  }
  .detail-preview:hover .zoom-hint{opacity:1}

  /* 内容区 */
  .detail-body{padding:2rem 2.2rem 2.2rem}
  .detail-id{
    display:inline-block;
    font-size:.75rem;font-weight:600;
    letter-spacing:.08em;
    color:#40b4ff;
    background:rgba(64,180,255,.1);
    border:1px solid rgba(64,180,255,.25);
    padding:.3rem .8rem;border-radius:40px;
    margin-bottom:1rem;
  }
  .detail-title{
    font-size:clamp(1.6rem,4vw,2.4rem);
    font-weight:700;line-height:1.2;
    letter-spacing:-.02em;margin-bottom:1rem;
    background:linear-gradient(135deg,#fff 0%,#b0e0ff 60%,#d0a0ff 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .detail-desc{
    color:#9fb2c8;font-size:1rem;
    line-height:1.75;white-space:pre-wrap;
    margin-bottom:1.8rem;
  }
  .detail-meta{
    display:flex;flex-wrap:wrap;gap:.6rem;
    margin-bottom:2rem;
  }
  .meta-chip{
    display:inline-flex;align-items:center;gap:.4rem;
    padding:.45rem 1rem;border-radius:40px;
    font-size:.82rem;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    color:#b0c4d8;
  }
  .meta-chip code{
    font-family:ui-monospace,monospace;
    color:#7db8ff;font-size:.8rem;
  }

  /* 下载链接区 */
  .links-section h3{
    font-size:1.1rem;font-weight:600;
    margin-bottom:1rem;color:#eef2f6;
    display:flex;align-items:center;gap:.5rem;
  }
  .links-section h3::before{
    content:"";width:4px;height:18px;border-radius:4px;
    background:linear-gradient(180deg,#40b4ff,#7b5aff);
  }
  .links-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:1rem;
  }
  .link-card{
    display:flex;align-items:center;justify-content:space-between;
    gap:1rem;padding:1.1rem 1.3rem;
    border-radius:20px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);
    text-decoration:none;color:inherit;
    transition:.25s;
  }
  .link-card:hover{
    background:rgba(64,180,255,.08);
    border-color:rgba(64,180,255,.3);
    transform:translateY(-2px);
  }
  .link-card .link-left{
    display:flex;align-items:center;gap:.8rem;min-width:0;
  }
  .link-icon{
    width:40px;height:40px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;flex-shrink:0;
  }
  .link-icon.baidu{background:rgba(40,100,200,.15);color:#7db8ff}
  .link-icon.quark{background:rgba(100,200,150,.12);color:#7dffb0}
  .link-icon.default-link{background:rgba(255,255,255,.06);color:#c0d0e0}
  .link-text{min-width:0}
  .link-text .link-name{
    font-weight:600;font-size:.95rem;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .link-text .link-sub{
    font-size:.75rem;color:#6d7f93;margin-top:.15rem;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .link-text .code-badge{
    display:inline-block;
    font-family:ui-monospace,monospace;
    font-size:.72rem;
    background:rgba(64,180,255,.12);
    color:#7db8ff;
    padding:.15rem .5rem;border-radius:20px;
    margin-top:.3rem;
  }
  .link-go{
    font-size:1.2rem;color:#4a5a6a;flex-shrink:0;
    transition:.25s;
  }
  .link-card:hover .link-go{color:#40b4ff;transform:translateX(3px)}

  /* 灯箱 */
  .lightbox{
    position:fixed;inset:0;z-index:200;
    background:rgba(0,0,0,.92);backdrop-filter:blur(20px);
    display:none;align-items:center;justify-content:center;
    padding:2rem;
  }
  .lightbox.active{display:flex}
  .lightbox img{
    max-width:92vw;max-height:88vh;
    border-radius:24px;
    box-shadow:0 40px 100px rgba(0,0,0,.8);
    animation:zoomIn .35s cubic-bezier(.23,1,.32,1);
  }
  @keyframes zoomIn{
    from{opacity:0;transform:scale(.92)}
    to{opacity:1;transform:scale(1)}
  }
  .lightbox-close{
    position:absolute;top:1.5rem;right:1.5rem;
    width:48px;height:48px;border-radius:50%;
    background:rgba(255,255,255,.1);
    border:none;color:#fff;font-size:1.6rem;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:.2s;
  }
  .lightbox-close:hover{background:rgba(255,255,255,.25)}

  /* 提示 */
  .toast{
    position:fixed;bottom:2rem;left:50%;
    transform:translateX(-50%) translateY(100px);
    background:rgba(20,30,40,.95);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.1);
    padding:1rem 2rem;border-radius:60px;
    font-size:.9rem;z-index:300;opacity:0;
    transition:.4s cubic-bezier(.23,1,.32,1);
    pointer-events:none;
    box-shadow:0 20px 40px rgba(0,0,0,.6);
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  @media(max-width:700px){
    .detail-body{padding:1.5rem 1.3rem 1.8rem}
    .detail-preview{aspect-ratio:16/10}
    .links-list{grid-template-columns:1fr}
    .topbar{padding:.8rem 1rem}
  }
</style>
</head>
<body>
<div class="aurora-bg"></div>
<div class="grid-overlay"></div>

<!-- 顶部返回栏 -->
<div class="topbar">
  <a class="back-btn" id="backBtn" href="./">← 返回列表</a>
  <span class="crumb" id="crumb">加载中…</span>
</div>

<!-- 详情主体 -->
<div class="detail-wrap" id="detailWrap">
  <div class="state">
    <div class="spinner"></div>
    <p>正在加载资源详情…</p>
  </div>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">×</button>
  <img src="" alt="预览大图" id="lightboxImg">
</div>

<!-- 提示 -->
<div class="toast" id="toast"></div>

<script>
// ========== 配置 ==========
const RAW_URL = 'https://raw.githubusercontent.com/zhangjiashu210303/UE-resources/main/assets.json';

// ========== 元素 ==========
const detailWrap = document.getElementById('detailWrap');
const crumb = document.getElementById('crumb');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');
const toast = document.getElementById('toast');

// ========== 工具 ==========
function showToast(msg, duration = 2600) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

// 判断是否直链（用于直接下载）
function isDirectDownload(url) {
  return /\.(zip|rar|7z|png|jpe?g|webp|gif|mp4|webm|mov|uasset|umap|fbx|obj|gltf|glb|blend|psd|pdf|txt|json)(\?.*)?$/i.test(url);
}

// 链接图标
function linkIconClass(name) {
  if (name.includes('百度')) return 'baidu';
  if (name.includes('夸克')) return 'quark';
  return 'default-link';
}
function linkIconEmoji(name) {
  if (name.includes('百度')) return '☁️';
  if (name.includes('夸克')) return '⚡';
  if (name.includes('蓝奏')) return '🔵';
  if (name.includes('阿里')) return '🟠';
  return '🔗';
}

// ========== 从 URL 取资源 ID ==========
// 支持：
//   /index.html/10305
//   /index.html?id=10305
//   /10305
function getResourceId() {
  // 1) query 参数优先
  const params = new URLSearchParams(window.location.search);
  const qid = params.get('id');
  if (qid) return qid.trim();

  // 2) path 最后一段
  let path = window.location.pathname;
  // 去掉末尾斜杠
  path = path.replace(/\/+$/, '');
  if (!path) return null;

  const segs = path.split('/').filter(Boolean);
  if (!segs.length) return null;

  let last = segs[segs.length - 1];
  // 去掉 .html 后缀（如果最后一段是 index.html 这种，说明没有 ID）
  last = last.replace(/\.html?$/i, '');
  // 如果是 index 说明没有 ID
  if (!last || /^index$/i.test(last)) return null;
  return last;
}

// ========== 渲染详情 ==========
function renderDetail(asset) {
  crumb.textContent = asset.name || asset.id;

  const previewUrl = asset.preview || '';
  const isVideo = /\.(mp4|webm|mov|avi)$/i.test(previewUrl);

  // 预览区
  let previewHtml = '';
  if (previewUrl) {
    if (isVideo) {
      previewHtml = `
        <div class="detail-preview" style="cursor:pointer" onclick="window.open('${escapeHtml(previewUrl)}','_blank')">
          <video src="${escapeHtml(previewUrl)}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;"></video>
          <span class="badge">🎬 视频预览</span>
          <span class="zoom-hint">点击播放 ↗</span>
        </div>`;
    } else {
      previewHtml = `
        <div class="detail-preview" id="previewBox">
          <img src="${escapeHtml(previewUrl)}" alt="${escapeHtml(asset.name)}" loading="lazy">
          <span class="zoom-hint">点击放大 🔍</span>
        </div>`;
    }
  } else {
    previewHtml = `<div class="detail-preview" style="cursor:default;display:flex;align-items:center;justify-content:center;color:#4a5a6a;background:#0d1218;">暂无预览图</div>`;
  }

  // 链接区
  const links = asset.links || [];
  const linksHtml = links.length
    ? links.map(link => {
        const direct = isDirectDownload(link.url);
        const iconCls = linkIconClass(link.name);
        const iconEmoji = linkIconEmoji(link.name);
        const codeHtml = link.code ? `<span class="code-badge">提取码：${escapeHtml(link.code)}</span>` : '';
        const subText = direct ? '直链下载' : (link.code ? '网盘 · 需要提取码' : '网盘链接');
        return `
          <a class="link-card" href="${escapeHtml(link.url)}"
             target="_blank" rel="noopener"
             ${direct ? 'download' : ''}>
            <div class="link-left">
              <div class="link-icon ${iconCls}">${iconEmoji}</div>
              <div class="link-text">
                <div class="link-name">${escapeHtml(link.name || '下载')}</div>
                <div class="link-sub">${subText}</div>
                ${codeHtml}
              </div>
            </div>
            <span class="link-go">${direct ? '⬇' : '↗'}</span>
          </a>`;
      }).join('')
    : `<div style="color:#6d7f93;font-size:.9rem;padding:1rem 0;">暂无下载链接</div>`;

  // meta chips
  const metaChips = [];
  if (asset.id) metaChips.push(`<span class="meta-chip">ID：<code>${escapeHtml(asset.id)}</code></span>`);
  if (asset.downloadDir) metaChips.push(`<span class="meta-chip">目录：<code>${escapeHtml(asset.downloadDir)}</code></span>`);
  metaChips.push(`<span class="meta-chip">${links.length} 个下载链接</span>`);

  detailWrap.innerHTML = `
    <article class="detail-card">
      ${previewHtml}
      <div class="detail-body">
        <span class="detail-id">UE RESOURCE · ${escapeHtml(asset.id || 'N/A')}</span>
        <h1 class="detail-title">${escapeHtml(asset.name)}</h1>
        <p class="detail-desc">${escapeHtml(asset.desc || '暂无描述')}</p>
        <div class="detail-meta">${metaChips.join('')}</div>
        <div class="links-section">
          <h3>下载链接</h3>
          <div class="links-list">${linksHtml}</div>
        </div>
      </div>
    </article>
  `;

  // 绑定预览点击
  const previewBox = document.getElementById('previewBox');
  if (previewBox) {
    previewBox.addEventListener('click', () => {
      lightboxImg.src = previewUrl;
      lightbox.classList.add('active');
    });
  }

  document.title = `${asset.name} · UE 资源详情`;
}

// ========== 渲染错误 / 未找到 ==========
function renderError(title, message, showBackHint = true) {
  crumb.textContent = title;
  document.title = `${title} · UE 资源`;
  detailWrap.innerHTML = `
    <div class="state" style="padding-top:4rem">
      <div style="font-size:3rem;margin-bottom:1rem;">🧭</div>
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(message)}</p>
      ${showBackHint ? `<a class="back-btn" href="./" style="margin-top:.5rem;">← 返回资源列表</a>` : ''}
    </div>
  `;
}

// ========== 主流程 ==========
async function init() {
  const id = getResourceId();

  // 没有 ID → 提示回列表
  if (!id) {
    crumb.textContent = '未指定资源';
    renderError(
      '未指定资源 ID',
      '当前页面需要带上资源 ID，例如：index.html/10305 或 index.html?id=10305',
      true
    );
    return;
  }

  // 拉 JSON
  try {
    const res = await fetch(RAW_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('JSON 根节点不是数组');

    const asset = data.find(item => String(item.id) === String(id));

    if (!asset) {
      renderError(
        '资源不存在',
        `在 assets.json 中找不到 ID 为「${id}」的资源，可能已被删除或 ID 有误。`,
        true
      );
      return;
    }

    renderDetail(asset);
  } catch (err) {
    console.error(err);
    renderError(
      '加载失败',
      `无法从 GitHub 读取 assets.json：${err.message}。请检查网络或仓库文件是否正常。`,
      true
    );
    showToast('⚠️ 加载失败，请稍后重试');
  }
}

// 灯箱关闭
lightboxClose.addEventListener('click', () => lightbox.classList.remove('active'));
lightbox.addEventListener('click', e => {
  if (e.target === lightbox) lightbox.classList.remove('active');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') lightbox.classList.remove('active');
});

init();
</script>
</body>
</html>
